  if(lines.length<2||!/^song details$/i.test(lines[0]))return c;

    ${post.coverImage?`<img src="${IMG(post.coverImage,900)}" data-o="${post.coverImage}" onerror="IMGFB(this)" class="article-cover" alt="${post.title}">`:''}
    ${post.videoFile?`
      <div class="media-block">
        <div class="media-label">🎬 Video</div>
        <video controls class="post-video" preload="metadata"><source src="${post.videoFile}"></video>
        <div style="text-align:center;margin-top:12px">
          <button class="dw-btn" onclick="startDownload('${post.videoFile}','video','${post.slug}')">⬇ Download Video</button>
        </div>
      </div>`:''}
    ${post.musicFile?`
      <div class="media-block">
        <div class="media-label">🎵 Audio</div>
        <audio controls class="post-audio" preload="metadata"><source src="${post.musicFile}"></audio>
        <div style="text-align:center;margin-top:12px">
          <button class="dw-btn" style="background:#111!important;margin-right:8px" data-wz-play='${(function(){var x=String(post.title||'').replace(/\[[^\]]*\]/g,' ').replace(/[-|\u2013\u2014]?\s*\(?\s*mp3(\s*download)?\s*\)?/ig,' ').replace(/\s+/g,' ').trim();var m=x.match(/^(.+?)\s*\|\s*(.+)$/)||x.match(/^(.+?)\s+by\s+(.+)$/i);return JSON.stringify({src:post.musicFile,title:m?m[1].trim():x,artist:m?m[2].replace(/[-|\s]+$/,'').trim():'',cover:post.coverImage||'',key:post.slug,kind:'post',url:'/posts/'+post.slug+'.html'}).replace(/&/g,'&amp;').replace(/'/g,'&#39;').replace(/"/g,'&quot;');})()}'>&#9654; Play in player</button>
          <button class="dw-btn" onclick="startDownload('${post.musicFile}','audio','${post.slug}')">⬇ Download Audio</button>
        </div>
      </div>`:''}
    ${(post.musicFile||post.videoFile)?`
      <div class="download-gate" id="dlGate" style="display:none">
        <h3>Your download is almost ready</h3>
        <p>A short ad helps us keep WAVZO free</p>
        <div class="ad-slot" style="min-height:60px;margin:12px 0">Advertisement</div>
        <div class="countdown" id="dlCountdown"></div>
        <button class="dw-btn" id="dlFinalBtn" disabled>Please wait...</button>
        <div class="ad-notice">Free download supported by ads</div>
      </div>`:''}
    <div class="article-body">${wzFixDetails(post.content)}</div>
    <div class="ad-slot">Advertisement</div>
    ${wzAuthorBox(post)}<div class="article-footer-meta">
      <span class="article-tag">${post.category}</span>
      <span class="article-tag">WAVZO</span>
    </div>
    ${related.length?`
      <div class="related-section">
        <h3 class="related-title">Read next in ${post.category}</h3>
        <div class="related-grid">
          ${related.map(r=>`
            <a href="/posts/${r.slug}.html" class="related-card">
              ${r.coverImage?`<img src="${IMG(r.coverImage,400)}" data-o="${r.coverImage}" onerror="IMGFB(this)" class="related-thumb" loading="lazy">`:'<div class="related-thumb-placeholder"></div>'}
              <div class="related-card-body">
                <span class="related-cat">${r.category}</span>
                <p class="related-card-title">${r.title}</p>
                <small class="related-date">${r.date}</small>
              </div>
            </a>
          `).join('')}
        </div>
      </div>`:''}
    ${wzNavHTML((typeof PREPOST!=='undefined'&&PREPOST&&PREPOST.more&&PREPOST.post&&PREPOST.post.slug===slug)?PREPOST.more:wzNavCalc(post,posts))}
    <div class="article-back"><a href="/" class="back-link">&larr; Back to all stories</a></div>

    <div class="comments-section">
      <h3 class="comments-title">💬 Comments (<span id="commentCount">${(post.comments||[]).length}</span>)</h3>
      <div class="comment-form">
        <input type="text" id="commentName" placeholder="Your name" maxlength="60">
        <textarea id="commentText" placeholder="Write a comment..." maxlength="1000" oninput="document.getElementById('cmLeft').textContent=1000-this.value.length+' left'"></textarea>
        <div class="cm-count" id="cmLeft">1000 left</div>
        <button class="dw-btn" style="padding:10px 20px;font-size:13px" onclick="postComment('${slug}')">Post Comment</button>
      </div>
      <div id="commentsList">${renderCommentsHTML(post.comments||[],slug)}</div>
    </div>
  `;
  wzSig=slug+'|'+post.title+'|'+String(post.content||'').length+'|'+(post.coverImage||'');
  wzEnhance();
}

async function init(){
  let slug=new URLSearchParams(window.location.search).get('slug');
  if(!slug){
    const m=window.location.pathname.match(/\/posts\/(.+)\.html$/);
    if(m)slug=m[1];
  }
  if(!slug)return;

  /* FAST-POST */
  if(typeof PREPOST!=='undefined'&&PREPOST&&PREPOST.post){
    renderPost(PREPOST.post,[...(PREPOST.related||[]),PREPOST.post]);
  }else{
    const cached=getCache();
    if(cached){
      const post=cached.find(p=>p.slug===slug);
      if(post){renderPost(post,cached);}
    }
  }

  // Always fetch fresh in background for accurate views/downloads
  try{
    const db=await getDB();
    const posts=db.posts||[];
    const post=posts.find(p=>p.slug===slug);
    if(post){
      var sig=slug+'|'+post.title+'|'+String(post.content||'').length+'|'+(post.coverImage||'');
      if(sig===wzSig&&document.querySelector('#articleInner .article-title'))wzSoftRefresh(post);
      else renderPost(post,posts);
      // Track view in background
      trackView(slug);
    }
  }catch(e){}
}

init();

window.addEventListener('scroll',()=>{
  document.getElementById('siteNav').classList.toggle('scrolled',window.scrollY>10);
  document.getElementById('backToTop').classList.toggle('visible',window.scrollY>400);
});
document.getElementById('backToTop').addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));
document.getElementById('subForm').addEventListener('submit',e=>{e.preventDefault();alert('Thanks!');});

<script>
/* WZ-TRACK */
(function(){
  var API='https://wavzo-db.dakudinamoses.workers.dev/track';
  var host=location.hostname;
  var live=(host==='wavzo.com.ng'||host==='www.wavzo.com.ng');
  var owner=false;try{owner=!!localStorage.getItem('wz_key');}catch(e){}
  function send(ev,kind,key){
    try{
      if(!live||owner||!key||!/^[\w.\-:~%]{1,120}$/.test(key))return;
      var body=JSON.stringify({ev:ev,kind:kind,key:key,ref:document.referrer||''});
      if(navigator.sendBeacon){navigator.sendBeacon(API,new Blob([body],{type:'text/plain'}));return;}
      fetch(API,{method:'POST',body:body,keepalive:true,headers:{'Content-Type':'text/plain'}});
    }catch(e){}
  }
  window.WZ={track:send};
  function pathSlug(dir){
    var m=location.pathname.match(new RegExp('^/'+dir+'/([^/]+?)(?:\\.html)?$'));
    if(!m)return '';
    try{return decodeURIComponent(m[1]);}catch(e){return m[1];}
  }
  function wrap(name,fn){
    var old=window[name];
    if(typeof old!=='function')return;
    window[name]=function(){try{fn.apply(null,arguments);}catch(e){} return old.apply(this,arguments);};
  }
  var path=location.pathname,kind='',key='';
  if(pathSlug('posts')){kind='post';key=pathSlug('posts');}
  else if(pathSlug('songs')){kind='song';key=pathSlug('songs');}
  else if(pathSlug('artists')){kind='artist';key=pathSlug('artists');}
  else if(path==='/'||path==='/index.html'){kind='page';key='home';}
  else if(path==='/artists.html'){kind='page';key='artists';}
  if(!kind)return;
  send('view',kind,key);

  // first play of any audio/video on the page
  var played={};
  document.addEventListener('play',function(e){
    var t=e.target;if(!t||!t.tagName)return;
    var id=(t.currentSrc||t.src||t.tagName);
    if(played[id])return;played[id]=1;
    send('play',kind,key);
  },true);

  if(kind==='post'){
    wrap('trackDownload',function(){send('download','post',key);});
    wrap('sharePost',function(){send('share','post',key);});
  }
  if(kind==='song'){
    wrap('downloadMp3',function(){send('download','song',key);});
    // a tap inside the YouTube player moves focus into the iframe
    window.addEventListener('blur',function(){
      setTimeout(function(){
        var a=document.activeElement;
        if(a&&a.tagName==='IFRAME'&&!a._wz){a._wz=1;send('yt','song',key);}
      },50);
    });
  }
  // clicks on outbound links (YouTube, streaming, social)
  document.addEventListener('click',function(e){
    var a=e.target&&e.target.closest?e.target.closest('a[href]'):null;
    if(!a)return;
    var h=a.getAttribute('href')||'';
    if(!/^https?:\/\//i.test(h)||h.indexOf(host)>-1)return;
    send(/youtube\.com|youtu\.be/i.test(h)?'yt':'click',kind,key);
  },true);
  if(kind==='artist'){
    document.addEventListener('click',function(e){
      var a=e.target&&e.target.closest?e.target.closest('a[href]'):null;
      if(a&&/\/songs\//.test(a.getAttribute('href')||''))send('click','artist',key);
    },true);
  }
})();
</script>
<script>
/* PROMO-BANNER */
(function(){
  var WA_NUMBER='2348124992371';
  if(!WA_NUMBER||WA_NUMBER.indexOf('REPLACE')===0)return;
  var owner=false;try{owner=!!localStorage.getItem('wz_key');}catch(e){}
  if(owner)return;
  var HIDE_KEY='wz_promo_hidden_until';
  try{
    var until=+(localStorage.getItem(HIDE_KEY)||0);
    if(until&&Date.now()<until)return;
  }catch(e){}

  var css=document.createElement('style');
  css.textContent=
    '#wzPromo{position:fixed;left:50%;bottom:-100px;transform:translateX(-50%);z-index:400;'+
    'background:#0a0a0a;color:#fff;padding:12px 16px;border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,.35);'+
    'display:flex;align-items:center;gap:10px;max-width:92vw;transition:bottom .5s ease;font-family:inherit}'+
    '#wzPromo.show{bottom:16px}'+
    '#wzPromo a{color:#fff;text-decoration:none;font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px}'+
    '#wzPromo .x{cursor:pointer;color:#888;font-size:16px;line-height:1;padding:2px 4px;flex-shrink:0}'+
    '@media(max-width:420px){#wzPromo a{font-size:12px}}';
  document.head.appendChild(css);

  var el=document.createElement('div');
  el.id='wzPromo';
  var text=encodeURIComponent("Hi WAVZO, I'd like to upload my song.");
  el.innerHTML='<a href="https://wa.me/'+WA_NUMBER+'?text='+text+'" target="_blank" rel="noopener">🎵 Upload your song on WAVZO — chat us on WhatsApp</a>'+
    '<span class="x" id="wzPromoClose">×</span>';
  document.body.appendChild(el);

  setTimeout(function(){el.classList.add('show');},2500);
  document.getElementById('wzPromoClose').addEventListener('click',function(e){
    e.preventDefault();e.stopPropagation();
    el.classList.remove('show');
    try{localStorage.setItem(HIDE_KEY,String(Date.now()+24*3600000));}catch(err){}
    setTimeout(function(){el.remove();},600);
  });
})();
</script>
<script>
/* reading progress + light/dark button */
(function(){
  var bar=document.createElement('div');bar.id='wzProg';document.body.appendChild(bar);
  var t=false;
  addEventListener('scroll',function(){if(t)return;t=true;requestAnimationFrame(function(){var h=document.documentElement,m=h.scrollHeight-h.clientHeight;bar.style.width=(m>0?Math.min(100,h.scrollTop/m*100):0)+'%';t=false;});},{passive:true});
  var nav=document.getElementById('siteNav');
  if(nav){
    var b=document.createElement('button');b.id='wzTheme';b.setAttribute('aria-label','Switch light or dark mode');
    var cur=function(){return document.documentElement.getAttribute('data-theme');};
    var paint=function(){b.innerHTML=cur()==='dark'?'&#9728;':'&#9790;';};
    b.onclick=function(){var n=cur()==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',n);try{localStorage.setItem('wz_theme',n);}catch(e){}paint();};
    paint();nav.appendChild(b);
  }
})();
</script>
