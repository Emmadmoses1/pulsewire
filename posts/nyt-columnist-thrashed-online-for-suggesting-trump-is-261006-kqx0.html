function getCache(){
  try{
    const c=JSON.parse(localStorage.getItem(CACHE_KEY)||'null');
    if(c)return c.posts;
  }catch(e){}
  return null;
}

async function getDB(){
  const res=await fetch(BIN_URL+'/latest',{headers:{'X-Master-Key':BIN_KEY}});
  const data=await res.json();
  return data.record||{posts:[]};
}
async function saveDB(db){
  await fetch(BIN_URL,{method:'PUT',headers:{'Content-Type':'application/json','X-Master-Key':BIN_KEY},body:JSON.stringify(db)});
  try{localStorage.setItem(CACHE_KEY,JSON.stringify({posts:[...(db.posts||[])].reverse(),ts:Date.now()}));}catch(e){}
}

async function trackView(slug){
  try{
    const db=await getDB();
    const p=db.posts.find(p=>p.slug===slug);
    if(p){
      p.views=(p.views||0)+1;
      try{
        const geo=await fetch('https://ipwho.is/').then(r=>r.json());
        const country=geo.country_code||'Unknown';
        db.countryViews=db.countryViews||{};
        db.countryViews[country]=(db.countryViews[country]||0)+1;
      }catch(e){}
      await saveDB(db);
    }
  }catch(e){}
}
async function trackDownload(slug,type){
  try{
    const db=await getDB();const p=db.posts.find(p=>p.slug===slug);
    if(p){
      p.downloads=(p.downloads||0)+1;
      if(type==='audio')p.audioDownloads=(p.audioDownloads||0)+1;
      if(type==='video')p.videoDownloads=(p.videoDownloads||0)+1;
      await saveDB(db);
    }
  }catch(e){}
}

// Forces the browser to SAVE the file instead of opening/playing it
function dlUrl(url,name){
  try{
    const u=String(url||'');
    const safe=String(name||'wavzo').replace(/\s*[—-]\s*WAVZO\s*$/i,'').replace(/[^A-Za-z0-9]+/g,'_').replace(/^_+|_+$/g,'').slice(0,80)||'wavzo';
    if(/^https?:\/\/res\.cloudinary\.com\//i.test(u)&&u.indexOf('/upload/')>-1&&u.indexOf('fl_attachment')<0){
      return u.replace('/upload/','/upload/fl_attachment:'+safe+'/');
    }
  }catch(e){}
  return url;
}
function startDownload(url,type,slug){
  if(type==='audio'){
    trackDownload(slug,type);
    const a=document.createElement('a');
    a.href=dlUrl(url,document.title);a.download='';a.style.display='none';
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    return;
  }
  const gate=document.getElementById('dlGate');
  const btn=document.getElementById('dlFinalBtn');
  const countdown=document.getElementById('dlCountdown');
  gate.style.display='block';
  gate.scrollIntoView({behavior:'smooth'});
  btn.disabled=true;btn.textContent='Please wait...';
  let sec=5;
  countdown.textContent='Download starts in '+sec+'s';
  const timer=setInterval(()=>{
    sec--;
    if(sec<=0){
      clearInterval(timer);
      countdown.textContent='✅ Ready!';
      btn.disabled=false;btn.textContent='⬇ DOWNLOAD NOW';
      btn.onclick=()=>{trackDownload(slug,type);const a=document.createElement('a');a.href=dlUrl(url,document.title);a.download='';a.click();};
    } else {
      countdown.textContent='Download starts in '+sec+'s';
    }
  },1000);
}

}

function escapeHtml(str){
  const div=document.createElement('div');
  div.textContent=str;
  return div.innerHTML;
}

function renderCommentsHTML(comments,slug){
  if(!comments||!comments.length)return '<p style="color:#666;font-size:13px;padding:10px 0">No comments yet. Be the first!</p>';
  return comments.map(c=>`
    <div class="comment-item">
      <div class="comment-header"><strong>${escapeHtml(c.name||'Anonymous')}</strong><span class="comment-date">${new Date(c.ts).toLocaleDateString()}</span></div>
      <p class="comment-text">${escapeHtml(c.text)}</p>
      <div class="comment-actions">
        <button onclick="likeComment('${slug}','${c.id}')">👍 ${c.likes||0}</button>
        <button onclick="toggleReplyForm('${c.id}')">Reply</button>
      </div>
      <div class="reply-form hidden" id="replyForm-${c.id}">
        <input type="text" id="replyName-${c.id}" placeholder="Your name">
        <textarea id="replyText-${c.id}" placeholder="Write a reply..."></textarea>
        <button class="dw-btn" style="padding:6px 14px;font-size:12px" onclick="postReply('${slug}','${c.id}')">Reply</button>
      </div>
      ${(c.replies&&c.replies.length)?`<div class="replies-list">${c.replies.map(r=>`
        <div class="reply-item">
          <div class="comment-header"><strong>${escapeHtml(r.name||'Anonymous')}</strong><span class="comment-date">${new Date(r.ts).toLocaleDateString()}</span></div>
          <p class="comment-text">${escapeHtml(r.text)}</p>
          <div class="comment-actions"><button onclick="likeReply('${slug}','${c.id}','${r.id}')">👍 ${r.likes||0}</button></div>
        </div>
      `).join('')}</div>`:''}
    </div>
  `).join('');
}

async function refreshComments(slug){
  const db=await getDB();
  const post=db.posts.find(p=>p.slug===slug);
  if(!post)return;
  document.getElementById('commentsList').innerHTML=renderCommentsHTML(post.comments||[],slug);
  document.getElementById('commentCount').textContent=(post.comments||[]).length;
}

async function postComment(slug){
  const nameEl=document.getElementById('commentName');
  const textEl=document.getElementById('commentText');
  const name=nameEl.value.trim()||'Anonymous';
  const text=textEl.value.trim();
  if(!text)return;
  const db=await getDB();
  const post=db.posts.find(p=>p.slug===slug);
  if(!post)return;
  post.comments=post.comments||[];
  post.comments.push({id:'c'+Date.now()+Math.random().toString(36).slice(2,6),name,text,ts:Date.now(),likes:0,replies:[]});
  await saveDB(db);
  textEl.value='';
  await refreshComments(slug);
}

function toggleReplyForm(commentId){
  const form=document.getElementById('replyForm-'+commentId);
  if(form)form.classList.toggle('hidden');
}

async function postReply(slug,commentId){
  const nameEl=document.getElementById('replyName-'+commentId);
  const textEl=document.getElementById('replyText-'+commentId);
  const name=nameEl.value.trim()||'Anonymous';
  const text=textEl.value.trim();
  if(!text)return;
  const db=await getDB();
  const post=db.posts.find(p=>p.slug===slug);
  if(!post)return;
  const comment=(post.comments||[]).find(c=>c.id===commentId);
  if(!comment)return;
  comment.replies=comment.replies||[];
  comment.replies.push({id:'r'+Date.now()+Math.random().toString(36).slice(2,6),name,text,ts:Date.now(),likes:0});
  await saveDB(db);
  await refreshComments(slug);
}

async function likeComment(slug,commentId){
  const db=await getDB();
  const post=db.posts.find(p=>p.slug===slug);
  if(!post)return;
  const comment=(post.comments||[]).find(c=>c.id===commentId);
  if(!comment)return;
  comment.likes=(comment.likes||0)+1;
  await saveDB(db);
  await refreshComments(slug);
}

async function likeReply(slug,commentId,replyId){
  const db=await getDB();
  const post=db.posts.find(p=>p.slug===slug);
  if(!post)return;
  const comment=(post.comments||[]).find(c=>c.id===commentId);
  if(!comment)return;
  const reply=(comment.replies||[]).find(r=>r.id===replyId);
  if(!reply)return;
  reply.likes=(reply.likes||0)+1;
  await saveDB(db);
  await refreshComments(slug);
}

  if(!post)return;
  post.reactions=post.reactions||{};
  const mine=getMyReaction(slug);

  if(mine===key){
    // un-react
    post.reactions[key]=Math.max(0,(post.reactions[key]||0)-1);
    setMyReaction(slug,'');
  } else {
    if(mine)post.reactions[mine]=Math.max(0,(post.reactions[mine]||0)-1);
    post.reactions[key]=(post.reactions[key]||0)+1;
    setMyReaction(slug,key);
  }

  await saveDB(db);
  await refreshReactions(slug);
}

async function init(){
  const slug='nyt-columnist-thrashed-online-for-suggesting-trump-is-261006-kqx0';
  if(!slug){
    const m=window.location.pathname.match(/\/posts\/(.+)\.html$/);
    if(m)slug=m[1];
  }
  if(!slug)return;

  /* FAST-POST */
  if(typeof PREPOST!=='undefined'&&PREPOST&&PREPOST.post){
    renderPost(PREPOST.post,[...(PREPOST.related||[]),PREPOST.post]);
  }else{
    const cached=getCache();
    if(cached){
      const post=cached.find(p=>p.slug===slug);
      if(post){renderPost(post,cached);}
    }
  }

  // Always fetch fresh in background for accurate views/downloads
  try{
    const db=await getDB();
    const posts=db.posts||[];
    const post=posts.find(p=>p.slug===slug);
    if(post){
      renderPost(post,posts);
      // Track view in background
      trackView(slug);
    }
  }catch(e){}
}

init();

<script>
/* WZ-TRACK */
(function(){
  var API='https://wavzo-db.dakudinamoses.workers.dev/track';
  var host=location.hostname;
  var live=(host==='wavzo.com.ng'||host==='www.wavzo.com.ng');
  var owner=false;try{owner=!!localStorage.getItem('wz_key');}catch(e){}
  function send(ev,kind,key){
    try{
      if(!live||owner||!key||!/^[\w.\-:~%]{1,120}$/.test(key))return;
      var body=JSON.stringify({ev:ev,kind:kind,key:key,ref:document.referrer||''});
      if(navigator.sendBeacon){navigator.sendBeacon(API,new Blob([body],{type:'text/plain'}));return;}
      fetch(API,{method:'POST',body:body,keepalive:true,headers:{'Content-Type':'text/plain'}});
    }catch(e){}
  }
  window.WZ={track:send};
  function pathSlug(dir){
    var m=location.pathname.match(new RegExp('^/'+dir+'/([^/]+?)(?:\\.html)?$'));
    if(!m)return '';
    try{return decodeURIComponent(m[1]);}catch(e){return m[1];}
  }
  function wrap(name,fn){
    var old=window[name];
    if(typeof old!=='function')return;
    window[name]=function(){try{fn.apply(null,arguments);}catch(e){} return old.apply(this,arguments);};
  }
  var path=location.pathname,kind='',key='';
  if(pathSlug('posts')){kind='post';key=pathSlug('posts');}
  else if(pathSlug('songs')){kind='song';key=pathSlug('songs');}
  else if(pathSlug('artists')){kind='artist';key=pathSlug('artists');}
  else if(path==='/'||path==='/index.html'){kind='page';key='home';}
  else if(path==='/artists.html'){kind='page';key='artists';}
  if(!kind)return;
  send('view',kind,key);

  // first play of any audio/video on the page
  var played={};
  document.addEventListener('play',function(e){
    var t=e.target;if(!t||!t.tagName)return;
    var id=(t.currentSrc||t.src||t.tagName);
    if(played[id])return;played[id]=1;
    send('play',kind,key);
  },true);

  if(kind==='post'){
    wrap('trackDownload',function(){send('download','post',key);});
    wrap('sharePost',function(){send('share','post',key);});
  }
  if(kind==='song'){
    wrap('downloadMp3',function(){send('download','song',key);});
    // a tap inside the YouTube player moves focus into the iframe
    window.addEventListener('blur',function(){
      setTimeout(function(){
        var a=document.activeElement;
        if(a&&a.tagName==='IFRAME'&&!a._wz){a._wz=1;send('yt','song',key);}
      },50);
    });
  }
  // clicks on outbound links (YouTube, streaming, social)
  document.addEventListener('click',function(e){
    var a=e.target&&e.target.closest?e.target.closest('a[href]'):null;
    if(!a)return;
    var h=a.getAttribute('href')||'';
    if(!/^https?:\/\//i.test(h)||h.indexOf(host)>-1)return;
    send(/youtube\.com|youtu\.be/i.test(h)?'yt':'click',kind,key);
  },true);
  if(kind==='artist'){
    document.addEventListener('click',function(e){
      var a=e.target&&e.target.closest?e.target.closest('a[href]'):null;
      if(a&&/\/songs\//.test(a.getAttribute('href')||''))send('click','artist',key);
    },true);
  }
})();
</script>
