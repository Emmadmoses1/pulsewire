const PREPOST={"post": {"title": "What CIPM’s 58th International Conference Revealed About Nigeria’s Changing Workplace", "slug": "what-cipm-s-58th-international-conference-revealed-about-261003-4lgn", "category": "NEWS", "excerpt": "A job description written three years ago may already be struggling to describe the job being done today. The post What CIPM’s 58th International Conference Revealed About Nigeria’s Changing Workplace", "content": "<p><strong>From AI and productivity to leadership, skills and organisational culture, nearly 5,000 delegates gathered in Abuja for CIPM ICE 2026, regarded as Africa’s largest HR event.<\/strong> But beyond the numbers was a bigger question: how must organisations and the people who power them, reposition for what comes next?<\/p>\n<p>A job description written three years ago may already be struggling to describe the job being done today.<\/p>\n<p>Artificial intelligence is finding its way into everyday work. Employees are asking different questions of their employers. Leaders are under pressure to do more with less. Skills are becoming obsolete faster, and organisations are discovering that having talented people does not automatically translate into having a high-performing organisation.<\/p>\n<p>Work has changed.<\/p>\n<p>The more interesting question is whether the way we manage people has changed enough with it.<\/p>\n<p>That question followed many of the conversations at the 58th International Conference and Exhibition of the Chartered Institute of Personnel Management of Nigeria (CIPM), held in Abuja from September 21–24, 2026, under the theme “Repositioning for Value and Impact.”<\/p>\n<p>On paper, it sounds like the sort of phrase one might expect at a professional conference. But across four days of conversations among business leaders, policymakers, HR professionals, academics and other workplace thinkers, it became something far more practical: What exactly is HR doing that makes an organisation better?<\/p>\n<p>It is a question worth asking.<\/p>\n<p>The days of counting activities are disappearing<\/p>\n<p>For years, much of HR’s success could be communicated in activities.<\/p>\n<p>How many people were recruited? How many employees were trained? How many engagement programmes were organised? How quickly were vacancies filled?<\/p>\n<p>Those things still matter but increasingly, organisations want to know what happened<\/p>\n<p>because of them.<\/p>\n<p>Did productivity improve? Are we retaining the people we cannot afford to lose? Are our managers becoming better leaders? Do we have the skills the business will need tomorrow? Is our culture helping or quietly frustrating our strategy?<\/p>\n<p>Perhaps most importantly: can HR connect its work to results that matter to the<\/p>\n<p>organisation?<\/p>\n<p>That was one of the clearest threads running through the conversations in Abuja.<\/p>\n<p>CIPM President and Chairman of the Governing Council, Mallam Ahmed Ladan Gobir, FCIPM,<\/p>\n<p>fnli, put the challenge to delegates plainly: the real value of the conference would not be<\/p>\n<p>determined by what happened inside the venue, but by what people did differently when they<\/p>\n<p>returned to their organisations.<\/p>\n<p>It is an important distinction.<\/p>\n<p>A conference can fill notebooks. Impact has to show up somewhere else – in a better decision,<\/p>\n<p>a stronger manager, a redesigned process, a more productive team, a problem solved or<\/p>\n<p>perhaps even a difficult conversation an organisation has postponed for too long.<\/p>\n<p>Then there is AI<\/p>\n<p>It is almost impossible to have a serious conversation about the future of work today without<\/p>\n<p>artificial intelligence entering the room.<\/p>\n<p>The temptation is to reduce that conversation to one dramatic question: Will AI take people’s<\/p>\n<p>jobs?<\/p>\n<p>But the more useful questions are less dramatic and far more urgent.<\/p>\n<p>Which parts of jobs will change? Which skills will become more valuable? What happens to roles that can now be partially automated? Who decides where AI should and should not be used? How do organisations protect judgement, accountability and trust while pursuing efficiency? and who prepares people for all of this?<\/p>\n<p>That last question puts HR right in the middle of the conversation.<\/p>\n<p>Technology decisions can no longer sit entirely with technology teams. If AI changes how work is performed, it changes jobs. If it changes jobs, it changes skills. And if it changes skills, it changes recruitment, learning, performance, workforce planning and leadership.<\/p>\n<p>Suddenly, AI becomes a people issue too.<\/p>\n<p>The challenge for HR is not to become the IT department. It is to understand technology well enough to ask better questions about its impact on people and the organisation.<\/p>\n<p>Buying technology is relatively easy but building an organisation capable of using it well is harder.<\/p>\n<p>Perhaps we have been talking about HR too narrowly<\/p>\n<p>One of the more interesting things about a gathering of this nature is that the conversation eventually becomes bigger than the profession that convened it.<\/p>\n<p>Talk about people for long enough and one inevitably begins to talk about productivity.<\/p>\n<p>Talk about productivity and one arrives at competitiveness.<\/p>\n<p>Talk about competitiveness in Nigeria and, sooner or later, there is a conversation about national development.<\/p>\n<p>That is why what happens inside HR departments matters far beyond HR departments.<\/p>\n<p>A factory with poorly trained people will feel it in its output. A bank with weak leadership will eventually feel it in performance. A government institution with the wrong culture will make citizens experience the consequences. A company that cannot retain critical talent will eventually discover the cost on its balance sheet.<\/p>\n<p>People management, therefore, is not merely about keeping employees happy.<\/p>\n<p>At its best, it is about creating the conditions in which people can do work that produces value. That is a much bigger responsibility and it explains why a CIPM conference increasingly brings together voices beyond traditional HR circles.<\/p>\n<p>Nearly 5,000 people gathered for its conference but the number isn’t the story<\/p>\n<p>The 58th International Conference and Exhibition attracted 4,905 delegates – 4,020 physically<\/p>\n<p>and 885 virtually – drawn from public and private sector organisations.<\/p>\n<p>For any professional gathering, those are significant numbers but attendance alone is an easy<\/p>\n<p>metric.<\/p>\n<p>The more consequential question is what happens when nearly 5,000 people return to thousands of different desks, teams, organisations and spheres of influence.<\/p>\n<p>Does anything change?<\/p>\n<p>That may be a better measure of the conference than the number of people who walked through its doors.<\/p>\n<p>Because the danger with professional conferences is familiar.<\/p>\n<p>People arrive enthusiastic, notes are taken, photographs are shared, business cards are<\/p>\n<p>exchanged and LinkedIn fills with reflections.<\/p>\n<p>Then Monday comes.<\/p>\n<p>The inbox is waiting and the notebook joins several others on a shelf.<\/p>\n<p>“Repositioning for Value and Impact” asks for something harder which is to Take something<\/p>\n<p>back, change something and measure what happened.<\/p>\n<p>HR itself is being asked to reposition<\/p>\n<p>There is an irony in asking organisations to change if the profession responsible for much of that change remains the same.<\/p>\n<p>Today’s HR professional needs a considerably broader toolkit.<\/p>\n<p>Understanding people remains fundamental. But increasingly, so do data, technology, business models, finance, workforce planning, change, risk and commercial judgement.<\/p>\n<p>The HR leader sitting with a CEO cannot speak only about HR. He or she must understand the business of the business.<\/p>\n<p>What makes money? What destroys value? Where is the organisation going? What capabilities will it need to get there? What people risks could prevent it? What evidence supports the recommendation being made?<\/p>\n<p>That shift from administrator to adviser, from activity to outcome, from intuition alone to evidence, is part of the repositioning taking place within the profession itself.<\/p>\n<p>This is perhaps where CIPM’s role becomes most consequential.<\/p>\n<p>As the statutory body responsible for regulating Human Resource Management practice in Nigeria, CIPM sits at an interesting intersection: between today’s HR profession and the one Nigeria will need tomorrow.<\/p>\n<p>That means setting standards and developing professionals, certainly.<\/p>\n<p>But it also means creating spaces where uncomfortable questions about the profession can be asked.<\/p>\n<p>A conference in its 58th edition that only celebrates what HR already knows would have limited usefulness.<\/p>\n<p>One that asks what HR needs to unlearn, relearn and become is a different proposition.<\/p>\n<p>The real conference starts afterwards<\/p>\n<p>By the time the final sessions ended in Abuja, delegates had heard a great deal about transformation, technology, leadership, capability, productivity and impact. But eventually, every conference badge comes off.<\/p>\n<p>The stages are dismantled, exhibition stands disappear, delegates catch their flights and photographs move down social-media timelines.<\/p>\n<p>What remains is what people do with what they heard.<\/p>\n<p>For an HR professional, that might mean finally measuring the business effect of a programme instead of merely reporting that it happened.<\/p>\n<p>For a CEO, it could mean bringing the people conversation into strategy earlier.<\/p>\n<p>For a public-sector leader, it might mean asking whether existing systems make excellent performance easier or harder and; For an organisation experimenting with AI, it could mean spending as much time thinking about people and work redesign as it does thinking about software.<\/p>\n<p>There will be another conference.<\/p>\n<p>There will be another theme.<\/p>\n<p>But the question left behind by CIPM’s 58th International Conference and Exhibition is worth carrying beyond Abuja:<\/p>\n<p>What are we doing differently because the world of work is different?<\/p>\n<p>For HR, that question is becoming increasingly difficult to avoid and that is precisely the point.<\/p>\n<p>Repositioning begins when the old position is no longer enough.<\/p>\n<p class=\"article-source\"><em>Source: <a href=\"https://www.channelstv.com/2026/10/02/what-cipms-58th-international-conference-revealed-about-nigerias-changing-workplace/\" target=\"_blank\" rel=\"noopener nofollow\">https://www.channelstv.com/2026/10/02/what-cipms-58th-international-conference-revealed-about-nigerias-changing-workplace/<\/a><\/em><\/p>", "coverImage": "https://res.cloudinary.com/smg1blzu/image/upload/v1791034412/hl8fw7msc3tn7c7sibgv.jpg", "musicFile": null, "videoFile": null, "date": "Oct 3, 2026", "createdAt": 1791034410105, "views": 1}, "related": [{"slug": "healey-says-surprise-uk-growth-is-sign-of-261015-3vpd", "title": "Healey says surprise UK growth is 'sign of resilience' ahead of Budget", "category": "NEWS", "coverImage": "https://res.cloudinary.com/smg1blzu/image/upload/v1792065071/iorflqpqyn3st7qjhili.jpg", "date": "Oct 15, 2026"}, {"slug": "reform-faces-criticism-after-councillors-filmed-making-racist-261015-kyrp", "title": "Reform faces criticism after councillors filmed making racist comments", "category": "NEWS", "coverImage": "https://res.cloudinary.com/smg1blzu/image/upload/v1792065080/t0uay0cf3ferstgqiim1.jpg", "date": "Oct 15, 2026"}, {"slug": "this-sparsely-populated-red-state-quietly-climbed-to-261015-ox3v", "title": "This sparsely populated red state quietly climbed to the top of America's financial rankings", "category": "NEWS", "coverImage": "https://res.cloudinary.com/smg1blzu/image/upload/v1792065089/d4iprutnzyosytv1d6gf.png", "date": "Oct 15, 2026"}]};

function getCache(){
  try{
    const c=JSON.parse(localStorage.getItem(CACHE_KEY)||'null');
    if(c)return c.posts;
  }catch(e){}
  return null;
}

async function getDB(){
  const res=await fetch(BIN_URL+'/latest',{headers:{'X-Master-Key':BIN_KEY}});
  const data=await res.json();
  return data.record||{posts:[]};
}
async function saveDB(db){
  await fetch(BIN_URL,{method:'PUT',headers:{'Content-Type':'application/json','X-Master-Key':BIN_KEY},body:JSON.stringify(db)});
  try{localStorage.setItem(CACHE_KEY,JSON.stringify({posts:[...(db.posts||[])].reverse(),ts:Date.now()}));}catch(e){}
}

async function trackView(slug){
  try{
    const db=await getDB();
    const p=db.posts.find(p=>p.slug===slug);
    if(p){
      p.views=(p.views||0)+1;
      try{
        const geo=await fetch('https://ipwho.is/').then(r=>r.json());
        const country=geo.country_code||'Unknown';
        db.countryViews=db.countryViews||{};
        db.countryViews[country]=(db.countryViews[country]||0)+1;
      }catch(e){}
      await saveDB(db);
    }
  }catch(e){}
}
async function trackDownload(slug,type){
  try{
    const db=await getDB();const p=db.posts.find(p=>p.slug===slug);
    if(p){
      p.downloads=(p.downloads||0)+1;
      if(type==='audio')p.audioDownloads=(p.audioDownloads||0)+1;
      if(type==='video')p.videoDownloads=(p.videoDownloads||0)+1;
      await saveDB(db);
    }
  }catch(e){}
}

function startDownload(url,type,slug){
  const gate=document.getElementById('dlGate');
  const btn=document.getElementById('dlFinalBtn');
  const countdown=document.getElementById('dlCountdown');
  gate.style.display='block';
  gate.scrollIntoView({behavior:'smooth'});
  btn.disabled=true;btn.textContent='Please wait...';
  let sec=5;
  countdown.textContent='Download starts in '+sec+'s';
  const timer=setInterval(()=>{
    sec--;
    if(sec<=0){
      clearInterval(timer);
      countdown.textContent='✅ Ready!';
      btn.disabled=false;btn.textContent='⬇ DOWNLOAD NOW';
      btn.onclick=()=>{trackDownload(slug,type);const a=document.createElement('a');a.href=url;a.download='';a.click();};
    } else {
      countdown.textContent='Download starts in '+sec+'s';
    }
  },1000);
}

function escapeHtml(str){
  const div=document.createElement('div');
  div.textContent=str;
  return div.innerHTML;
}

function renderCommentsHTML(comments,slug){
  if(!comments||!comments.length)return '<p style="color:#666;font-size:13px;padding:10px 0">No comments yet. Be the first!</p>';
  return comments.map(c=>`
    <div class="comment-item">
      <div class="comment-header"><strong>${escapeHtml(c.name||'Anonymous')}</strong><span class="comment-date">${new Date(c.ts).toLocaleDateString()}</span></div>
      <p class="comment-text">${escapeHtml(c.text)}</p>
      <div class="comment-actions">
        <button onclick="likeComment('${slug}','${c.id}')">👍 ${c.likes||0}</button>
        <button onclick="toggleReplyForm('${c.id}')">Reply</button>
      </div>
      <div class="reply-form hidden" id="replyForm-${c.id}">
        <input type="text" id="replyName-${c.id}" placeholder="Your name">
        <textarea id="replyText-${c.id}" placeholder="Write a reply..."></textarea>
        <button class="dw-btn" style="padding:6px 14px;font-size:12px" onclick="postReply('${slug}','${c.id}')">Reply</button>
      </div>
      ${(c.replies&&c.replies.length)?`<div class="replies-list">${c.replies.map(r=>`
        <div class="reply-item">
          <div class="comment-header"><strong>${escapeHtml(r.name||'Anonymous')}</strong><span class="comment-date">${new Date(r.ts).toLocaleDateString()}</span></div>
          <p class="comment-text">${escapeHtml(r.text)}</p>
          <div class="comment-actions"><button onclick="likeReply('${slug}','${c.id}','${r.id}')">👍 ${r.likes||0}</button></div>
        </div>
      `).join('')}</div>`:''}
    </div>
  `).join('');
}

async function refreshComments(slug){
  const db=await getDB();
  const post=db.posts.find(p=>p.slug===slug);
  if(!post)return;
  document.getElementById('commentsList').innerHTML=renderCommentsHTML(post.comments||[],slug);
  document.getElementById('commentCount').textContent=(post.comments||[]).length;
}

async function postComment(slug){
  const nameEl=document.getElementById('commentName');
  const textEl=document.getElementById('commentText');
  const name=nameEl.value.trim()||'Anonymous';
  const text=textEl.value.trim();
  if(!text)return;
  const db=await getDB();
  const post=db.posts.find(p=>p.slug===slug);
  if(!post)return;
  post.comments=post.comments||[];
  post.comments.push({id:'c'+Date.now()+Math.random().toString(36).slice(2,6),name,text,ts:Date.now(),likes:0,replies:[]});
  await saveDB(db);
  textEl.value='';
  await refreshComments(slug);
}

function toggleReplyForm(commentId){
  const form=document.getElementById('replyForm-'+commentId);
  if(form)form.classList.toggle('hidden');
}

async function postReply(slug,commentId){
  const nameEl=document.getElementById('replyName-'+commentId);
  const textEl=document.getElementById('replyText-'+commentId);
  const name=nameEl.value.trim()||'Anonymous';
  const text=textEl.value.trim();
  if(!text)return;
  const db=await getDB();
  const post=db.posts.find(p=>p.slug===slug);
  if(!post)return;
  const comment=(post.comments||[]).find(c=>c.id===commentId);
  if(!comment)return;
  comment.replies=comment.replies||[];
  comment.replies.push({id:'r'+Date.now()+Math.random().toString(36).slice(2,6),name,text,ts:Date.now(),likes:0});
  await saveDB(db);
  await refreshComments(slug);
}

const REACTIONS=[
  {key:'like',emoji:'👍'},
  {key:'love',emoji:'❤️'},
  {key:'laugh',emoji:'😂'},
  {key:'wow',emoji:'😮'},
  {key:'sad',emoji:'😢'},
];

function getMyReaction(slug){
  try{return localStorage.getItem('pw_reaction_'+slug);}catch(e){return null;}
}
function setMyReaction(slug,key){
  try{localStorage.setItem('pw_reaction_'+slug,key);}catch(e){}
}

function renderReactionsHTML(reactions,slug){
  const mine=getMyReaction(slug);
  return REACTIONS.map(r=>`
    <button class="reaction-btn ${mine===r.key?'active':''}" onclick="toggleReaction('${slug}','${r.key}')">
      ${r.emoji} <span>${(reactions&&reactions[r.key])||0}</span>
    </button>
  `).join('');
}

async function refreshReactions(slug){
  const db=await getDB();
  const post=db.posts.find(p=>p.slug===slug);
  if(!post)return;
  document.getElementById('reactionsBar').innerHTML=renderReactionsHTML(post.reactions||{},slug);
}

async function toggleReaction(slug,key){
  const db=await getDB();
  const post=db.posts.find(p=>p.slug===slug);
  if(!post)return;
  post.reactions=post.reactions||{};
  const mine=getMyReaction(slug);

  if(mine===key){
    // un-react
    post.reactions[key]=Math.max(0,(post.reactions[key]||0)-1);
    setMyReaction(slug,'');
  } else {
    if(mine)post.reactions[mine]=Math.max(0,(post.reactions[mine]||0)-1);
    post.reactions[key]=(post.reactions[key]||0)+1;
    setMyReaction(slug,key);
  }

  await saveDB(db);
  await refreshReactions(slug);
}

async function init(){
  const slug='what-cipm-s-58th-international-conference-revealed-about-261003-4lgn';
  if(!slug){
    const m=window.location.pathname.match(/\/posts\/(.+)\.html$/);
    if(m)slug=m[1];
  }
  if(!slug)return;

  /* FAST-POST */
  if(typeof PREPOST!=='undefined'&&PREPOST&&PREPOST.post){
    renderPost(PREPOST.post,[...(PREPOST.related||[]),PREPOST.post]);
  }else{
    const cached=getCache();
    if(cached){
      const post=cached.find(p=>p.slug===slug);
      if(post){renderPost(post,cached);}
    }
  }

  // Always fetch fresh in background for accurate views/downloads
  try{
    const db=await getDB();
    const posts=db.posts||[];
    const post=posts.find(p=>p.slug===slug);
    if(post){
      renderPost(post,posts);
      // Track view in background
      trackView(slug);
    }
  }catch(e){}
}

<script>
/* WZ-TRACK */
(function(){
  var API='https://wavzo-db.dakudinamoses.workers.dev/track';
  var host=location.hostname;
  var live=(host==='wavzo.com.ng'||host==='www.wavzo.com.ng');
  var owner=false;try{owner=!!localStorage.getItem('wz_key');}catch(e){}
  function send(ev,kind,key){
    try{
      if(!live||owner||!key||!/^[\w.\-:~%]{1,120}$/.test(key))return;
      var body=JSON.stringify({ev:ev,kind:kind,key:key,ref:document.referrer||''});
      if(navigator.sendBeacon){navigator.sendBeacon(API,new Blob([body],{type:'text/plain'}));return;}
      fetch(API,{method:'POST',body:body,keepalive:true,headers:{'Content-Type':'text/plain'}});
    }catch(e){}
  }
  window.WZ={track:send};
  function pathSlug(dir){
    var m=location.pathname.match(new RegExp('^/'+dir+'/([^/]+?)(?:\\.html)?$'));
    if(!m)return '';
    try{return decodeURIComponent(m[1]);}catch(e){return m[1];}
  }
  function wrap(name,fn){
    var old=window[name];
    if(typeof old!=='function')return;
    window[name]=function(){try{fn.apply(null,arguments);}catch(e){} return old.apply(this,arguments);};
  }
  var path=location.pathname,kind='',key='';
  if(pathSlug('posts')){kind='post';key=pathSlug('posts');}
  else if(pathSlug('songs')){kind='song';key=pathSlug('songs');}
  else if(pathSlug('artists')){kind='artist';key=pathSlug('artists');}
  else if(path==='/'||path==='/index.html'){kind='page';key='home';}
  else if(path==='/artists.html'){kind='page';key='artists';}
  if(!kind)return;
  send('view',kind,key);

  // first play of any audio/video on the page
  var played={};
  document.addEventListener('play',function(e){
    var t=e.target;if(!t||!t.tagName)return;
    var id=(t.currentSrc||t.src||t.tagName);
    if(played[id])return;played[id]=1;
    send('play',kind,key);
  },true);

  if(kind==='post'){
    wrap('trackDownload',function(){send('download','post',key);});
    wrap('sharePost',function(){send('share','post',key);});
  }
  if(kind==='song'){
    wrap('downloadMp3',function(){send('download','song',key);});
    // a tap inside the YouTube player moves focus into the iframe
    window.addEventListener('blur',function(){
      setTimeout(function(){
        var a=document.activeElement;
        if(a&&a.tagName==='IFRAME'&&!a._wz){a._wz=1;send('yt','song',key);}
      },50);
    });
  }
  // clicks on outbound links (YouTube, streaming, social)
  document.addEventListener('click',function(e){
    var a=e.target&&e.target.closest?e.target.closest('a[href]'):null;
    if(!a)return;
    var h=a.getAttribute('href')||'';
    if(!/^https?:\/\//i.test(h)||h.indexOf(host)>-1)return;
    send(/youtube\.com|youtu\.be/i.test(h)?'yt':'click',kind,key);
  },true);
  if(kind==='artist'){
    document.addEventListener('click',function(e){
      var a=e.target&&e.target.closest?e.target.closest('a[href]'):null;
      if(a&&/\/songs\//.test(a.getAttribute('href')||''))send('click','artist',key);
    },true);
  }
})();
</script>
