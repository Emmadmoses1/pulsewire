const PREPOST={"post": {"title": "JACK CARR: The lesson from FlyDubai is simple. Be ready to save yourself", "slug": "jack-carr-the-lesson-from-flydubai-is-simple-261003-5cip", "category": "NEWS", "excerpt": "The FlyDubai Flight 1073 knife attack over Saudi Arabia exposes critical gaps in pilot screening and cockpit security that demand new reforms.", "content": "<p><strong>The events on FlyDubai Flight 1073 from Dubai to Tel Aviv on 30 September 2026 reads like something out of one of my thrillers.<\/strong> But what occurred in the skies over Saudi Arabia was not fiction, it was real world and highlights an adage I learned long ago and has been repeated in various incarnations across social channels with differing attributions over the years — hope is not a course of action, in most cases, no one is coming to save you, you will need to be your own cavalry.<\/p>\n<p>That means be prepared.<\/p>\n<p>I am actually surprised that this or something like this has not happened previously — an unhinged pilot or co-pilot killing the other, perhaps suicidal, perhaps in search of martyrdom, as what some terrorist organizations call an istishhadi or \"martyrdom seeker.\"<\/p>\n<p>FORMER ISRAELI PM HAILS ‘HEROISM’ AFTER PASSENGERS HELP THWART ALLEGED COCKPIT ATTACK<\/p>\n<p>With prior planning it is possible for pilots to work together in a \"martyrdom operation\" that would be much harder to thwart. Or a single pilot or co-pilot could work with other \"muscle\" sitting in first class to prevent passengers from doing what they did on September 30, giving the terrorist in the cockpit time to kill them all or once again turn an airliner into a weapon focused on a specific target.<\/p>\n<p>I think about scenarios like this every time I fly.<\/p>\n<p>I look at and evaluate the passengers, the flight attendants, and I always look in on the pilots as I enter the aircraft, searching for anything that does not look or feel right, remembering something a Vietnam-era Project Delta Army Special Forces soldier told me decades ago: \"if it doesn’t look right, it’s probably not.\"<\/p>\n<p>Trust your instincts — you have them for a reason.<\/p>\n<p>I am also identifying assets and liabilities among those groups. Who is a potential asset if things go south? I’m noting shoes, belts, shirts, watches, hats, bags, sunglasses, tattoos, cauliflower ear, and filing away what that tells me about each person. Which of them are likely to help — and which of them may hinder in the event of an incident.<\/p>\n<p>On September 30, the skies over Saudi Arabia were full of miracles. The pilot, Captain Smit Machchhar, was not immediately incapacitated in the initial knife attack and managed to open the cockpit door before collapsing. Passengers with the instinct to act, fight, and prevail were sitting near the front of the plane, one of the passengers had the wherewithal to pull back on the controls — something he remembered from watching a television show.<\/p>\n<p>HERO FLYDUBAI PILOT SAYS HE WAS 'FIGHTING FOR MY LIFE' AS PLANE PLUNGED AFTER COPILOT ATTACK<\/p>\n<p>And there happened to be a pilot or pilots onboard who were able land the plane. Incredible.<\/p>\n<p>If any one of those things had not happened, we would be talking about a very different incident, one in which every single person on that flight is dead.<\/p>\n<p>I weave a lot of history and the history of terrorism into my thrillers, and I also have a series of non-fiction books on terrorism, the second of which is on Pan Am 103, a plane that exploded over Lockerbie, Scotland, on December 21, 1988, killing 259 passengers and crew and 11 residents on the ground. In that attack, there was no warning — a bomb detonated in the cargo hold at 31,000 feet.<\/p>\n<p>The destruction of Pan Am 103 horrified the world — and led to important changes in airline security, thanks in large part to pressure from victims’ families who pushed lawmakers to pass the Aviation Security Improvement Act of 1990. That legislation heightened the focus on domestic and international security, including placing federal security managers at major airports and requiring background checks on all air carrier workers. The law demanded the FAA work in tandem with the FBI, expanded scrutiny of overseas airports, and improved the flow of terrorist threat information.<\/p>\n<p>AMERICA BUILT A FORTRESS AFTER 9/11. THEN THE THREAT STARTED HIDING IN PLAIN SIGHT<\/p>\n<p>The recent FlyDubai event should lead to changes as well, namely enhanced pilot screenings. It is not just about qualifications and your ability to fly a plane — it’s about your background, associations, and your mental stability.<\/p>\n<p>If, for example, a background check finds that instead of funding your 401(k) each month, you are diverting funds to Hezbollah or a charity funding terrorist organizations — an obvious red flag — you should not be a pilot and certainly should not be flying a plane full of Israelis into Tel Aviv.<\/p>\n<p>This is common sense to most, but common sense seems to be in limited supply these days.<\/p>\n<p>The model for hijackings and the use of terror focused on airlines was different before September 11, 2001. Typically, in the 1970s and 1980s, planes were hijacked and the passengers were exchanged for prisoners or ransomed — sometimes a passenger or passengers were killed to make a point.<\/p>\n<p>SEN MCCORMICK: THE HEROIC PASSENGERS OF FLIGHT 93 SHOWED AMERICA HOW TO STAND UNITED<\/p>\n<p>From a tactical security standpoint that meant that you would want a window seat so you were not in the aisle where you could be struck and injured or grabbed by a terrorist — you wanted to be able to survey the situation, bide your time, and act when appropriate.<\/p>\n<p>On September 11, 2001, that paradigm shifted — planes and passengers were not being hijacked to bring about a political end or for a ransom, they were being turned into weapons. That adaptation by terrorists meant protectors needed to act quickly in the event of a hijacking. They moved from window seats to aisle seats to be in an advantageous position to recognize the threat and take immediate decisive action. And by \"protectors\" I do not mean military or law enforcement, I mean citizens. I am referring to those who have not suppressed the will to fight and have not outsourced their protection to a government or outside entity who is not coming to save them.<\/p>\n<p>Protecting those who cannot protect themselves is our responsibility as citizens, as husbands, as fathers. The FlyDubai incident is an example of that duty and of the warrior mindset — from the pilot to the passengers who all acted heroically to save the day.<\/p>\n<p>Col. John Boyd developed something called the OODA Loop — Observe, Orient, Decide, Act. In combat, in most cases, whoever does that faster than their opponent — or who can disrupt their enemy in the middle of their loop — will be victorious. That is what the pilot and passengers did on the FlyDubai flight. They stepped up and tapped into that primal urge to live and to protect that is in all of our DNA — and they prevailed.<\/p>\n<p>The enemy will learn and adapt to September 30, 2026.<\/p>\n<p>Next time it might be both pilots or it might be one incapacitating the other, working in conjunction with a passenger or passengers who will block access to the cockpit. We must adapt as well to ensure those with mental disorders or associations with terrorist organizations or those who fund them are kept from the ranks of the aviators we all trust with our lives.<\/p>\n<p>As John Steinbeck writes in The Acts of King Arthur and his Noble Knights, \"‘Now — I will lay down the law, and you will learn it word by word, and every word must be edged with fire. This is the law. The purpose of fighting is to win. There is no possible victory in defense. The sword is more important than the shield, and skill is more important than either. The final weapon is the brain, all else is supplementary.’\"<\/p>\n<p>Remember — hope is not a course of action.<\/p>\n<p>In most cases, no one is coming to save you. Your mind is the ultimate weapon, and you will need it, coupled with the will to fight, to save yourself and your loved ones, and in this case, an entire plane full of innocent people.<\/p>\n<p>Be prepared.<\/p>\n<p class=\"article-source\"><em>Source: <a href=\"https://www.foxnews.com/opinion/jack-carr-lesson-flydubai-simple-ready-save-yourself\" target=\"_blank\" rel=\"noopener nofollow\">https://www.foxnews.com/opinion/jack-carr-lesson-flydubai-simple-ready-save-yourself<\/a><\/em><\/p>", "coverImage": "https://res.cloudinary.com/smg1blzu/image/upload/v1791046097/uixcklwk68ahqlfr7lxs.jpg", "musicFile": null, "videoFile": null, "date": "Oct 3, 2026", "createdAt": 1791046095969}, "related": [{"slug": "healey-says-surprise-uk-growth-is-sign-of-261015-3vpd", "title": "Healey says surprise UK growth is 'sign of resilience' ahead of Budget", "category": "NEWS", "coverImage": "https://res.cloudinary.com/smg1blzu/image/upload/v1792065071/iorflqpqyn3st7qjhili.jpg", "date": "Oct 15, 2026"}, {"slug": "reform-faces-criticism-after-councillors-filmed-making-racist-261015-kyrp", "title": "Reform faces criticism after councillors filmed making racist comments", "category": "NEWS", "coverImage": "https://res.cloudinary.com/smg1blzu/image/upload/v1792065080/t0uay0cf3ferstgqiim1.jpg", "date": "Oct 15, 2026"}, {"slug": "this-sparsely-populated-red-state-quietly-climbed-to-261015-ox3v", "title": "This sparsely populated red state quietly climbed to the top of America's financial rankings", "category": "NEWS", "coverImage": "https://res.cloudinary.com/smg1blzu/image/upload/v1792065089/d4iprutnzyosytv1d6gf.png", "date": "Oct 15, 2026"}]};

function getCache(){
  try{
    const c=JSON.parse(localStorage.getItem(CACHE_KEY)||'null');
    if(c)return c.posts;
  }catch(e){}
  return null;
}

async function getDB(){
  const res=await fetch(BIN_URL+'/latest',{headers:{'X-Master-Key':BIN_KEY}});
  const data=await res.json();
  return data.record||{posts:[]};
}
async function saveDB(db){
  await fetch(BIN_URL,{method:'PUT',headers:{'Content-Type':'application/json','X-Master-Key':BIN_KEY},body:JSON.stringify(db)});
  try{localStorage.setItem(CACHE_KEY,JSON.stringify({posts:[...(db.posts||[])].reverse(),ts:Date.now()}));}catch(e){}
}

async function trackView(slug){
  try{
    const db=await getDB();
    const p=db.posts.find(p=>p.slug===slug);
    if(p){
      p.views=(p.views||0)+1;
      try{
        const geo=await fetch('https://ipwho.is/').then(r=>r.json());
        const country=geo.country_code||'Unknown';
        db.countryViews=db.countryViews||{};
        db.countryViews[country]=(db.countryViews[country]||0)+1;
      }catch(e){}
      await saveDB(db);
    }
  }catch(e){}
}
async function trackDownload(slug,type){
  try{
    const db=await getDB();const p=db.posts.find(p=>p.slug===slug);
    if(p){
      p.downloads=(p.downloads||0)+1;
      if(type==='audio')p.audioDownloads=(p.audioDownloads||0)+1;
      if(type==='video')p.videoDownloads=(p.videoDownloads||0)+1;
      await saveDB(db);
    }
  }catch(e){}
}

function startDownload(url,type,slug){
  const gate=document.getElementById('dlGate');
  const btn=document.getElementById('dlFinalBtn');
  const countdown=document.getElementById('dlCountdown');
  gate.style.display='block';
  gate.scrollIntoView({behavior:'smooth'});
  btn.disabled=true;btn.textContent='Please wait...';
  let sec=5;
  countdown.textContent='Download starts in '+sec+'s';
  const timer=setInterval(()=>{
    sec--;
    if(sec<=0){
      clearInterval(timer);
      countdown.textContent='✅ Ready!';
      btn.disabled=false;btn.textContent='⬇ DOWNLOAD NOW';
      btn.onclick=()=>{trackDownload(slug,type);const a=document.createElement('a');a.href=url;a.download='';a.click();};

    }

}

function escapeHtml(str){
  const div=document.createElement('div');
  div.textContent=str;
  return div.innerHTML;
}

function renderCommentsHTML(comments,slug){
  if(!comments||!comments.length)return '<p style="color:#666;font-size:13px;padding:10px 0">No comments yet. Be the first!</p>';
  return comments.map(c=>`
    <div class="comment-item">
      <div class="comment-header"><strong>${escapeHtml(c.name||'Anonymous')}</strong><span class="comment-date">${new Date(c.ts).toLocaleDateString()}</span></div>
      <p class="comment-text">${escapeHtml(c.text)}</p>
      <div class="comment-actions">
        <button onclick="likeComment('${slug}','${c.id}')">👍 ${c.likes||0}</button>
        <button onclick="toggleReplyForm('${c.id}')">Reply</button>
      </div>
      <div class="reply-form hidden" id="replyForm-${c.id}">
        <input type="text" id="replyName-${c.id}" placeholder="Your name">
        <textarea id="replyText-${c.id}" placeholder="Write a reply..."></textarea>
        <button class="dw-btn" style="padding:6px 14px;font-size:12px" onclick="postReply('${slug}','${c.id}')">Reply</button>
      </div>
      ${(c.replies&&c.replies.length)?`<div class="replies-list">${c.replies.map(r=>`
        <div class="reply-item">
          <div class="comment-header"><strong>${escapeHtml(r.name||'Anonymous')}</strong><span class="comment-date">${new Date(r.ts).toLocaleDateString()}</span></div>
          <p class="comment-text">${escapeHtml(r.text)}</p>
          <div class="comment-actions"><button onclick="likeReply('${slug}','${c.id}','${r.id}')">👍 ${r.likes||0}</button></div>
        </div>
      `).join('')}</div>`:''}
    </div>
  `).join('');
}

async function refreshComments(slug){
  const db=await getDB();
  const post=db.posts.find(p=>p.slug===slug);
  if(!post)return;
  document.getElementById('commentsList').innerHTML=renderCommentsHTML(post.comments||[],slug);
  document.getElementById('commentCount').textContent=(post.comments||[]).length;
}

async function postComment(slug){
  const nameEl=document.getElementById('commentName');
  const textEl=document.getElementById('commentText');
  const name=nameEl.value.trim()||'Anonymous';
  const text=textEl.value.trim();
  if(!text)return;
  const db=await getDB();
  const post=db.posts.find(p=>p.slug===slug);
  if(!post)return;
  post.comments=post.comments||[];
  post.comments.push({id:'c'+Date.now()+Math.random().toString(36).slice(2,6),name,text,ts:Date.now(),likes:0,replies:[]});
  await saveDB(db);
  textEl.value='';
  await refreshComments(slug);
}

function toggleReplyForm(commentId){
  const form=document.getElementById('replyForm-'+commentId);
  if(form)form.classList.toggle('hidden');
}

async function postReply(slug,commentId){
  const nameEl=document.getElementById('replyName-'+commentId);
  const textEl=document.getElementById('replyText-'+commentId);
  const name=nameEl.value.trim()||'Anonymous';
  const text=textEl.value.trim();
  if(!text)return;
  const db=await getDB();
  const post=db.posts.find(p=>p.slug===slug);
  if(!post)return;
  const comment=(post.comments||[]).find(c=>c.id===commentId);
  if(!comment)return;
  comment.replies=comment.replies||[];
  comment.replies.push({id:'r'+Date.now()+Math.random().toString(36).slice(2,6),name,text,ts:Date.now(),likes:0});
  await saveDB(db);
  await refreshComments(slug);
}

async function likeComment(slug,commentId){
  const db=await getDB();
  const post=db.posts.find(p=>p.slug===slug);
  if(!post)return;
  const comment=(post.comments||[]).find(c=>c.id===commentId);
  if(!comment)return;
  comment.likes=(comment.likes||0)+1;
  await saveDB(db);
  await refreshComments(slug);
}

async function likeReply(slug,commentId,replyId){
  const db=await getDB();
  const post=db.posts.find(p=>p.slug===slug);
  if(!post)return;
  const comment=(post.comments||[]).find(c=>c.id===commentId);
  if(!comment)return;
  const reply=(comment.replies||[]).find(r=>r.id===replyId);
  if(!reply)return;
  reply.likes=(reply.likes||0)+1;
  await saveDB(db);
  await refreshComments(slug);
}

  {key:'sad',emoji:'😢'},
];

function getMyReaction(slug){
  try{return localStorage.getItem('pw_reaction_'+slug);}catch(e){return null;}
}
function setMyReaction(slug,key){
  try{localStorage.setItem('pw_reaction_'+slug,key);}catch(e){}
}

function renderReactionsHTML(reactions,slug){
  const mine=getMyReaction(slug);
  return REACTIONS.map(r=>`
    <button class="reaction-btn ${mine===r.key?'active':''}" onclick="toggleReaction('${slug}','${r.key}')">
      ${r.emoji} <span>${(reactions&&reactions[r.key])||0}</span>
    </button>
  `).join('');
}

async function refreshReactions(slug){
  const db=await getDB();
  const post=db.posts.find(p=>p.slug===slug);
  if(!post)return;
  document.getElementById('reactionsBar').innerHTML=renderReactionsHTML(post.reactions||{},slug);
}

async function toggleReaction(slug,key){
  const db=await getDB();
  const post=db.posts.find(p=>p.slug===slug);
  if(!post)return;
  post.reactions=post.reactions||{};
  const mine=getMyReaction(slug);

  if(mine===key){
    // un-react
    post.reactions[key]=Math.max(0,(post.reactions[key]||0)-1);
    setMyReaction(slug,'');
  } else {
    if(mine)post.reactions[mine]=Math.max(0,(post.reactions[mine]||0)-1);
    post.reactions[key]=(post.reactions[key]||0)+1;
    setMyReaction(slug,key);
  }

  await saveDB(db);
  await refreshReactions(slug);
}

    <div class="article-footer-meta">

    ${related.length?`
      <div class="related-section">

        <div class="related-grid">

              ${r.coverImage?`<img src="${IMG(r.coverImage,400)}" data-o="${r.coverImage}" onerror="IMGFB(this)" class="related-thumb" loading="lazy">`:'<div class="related-thumb-placeholder"></div>'}

async function init(){
  const slug='jack-carr-the-lesson-from-flydubai-is-simple-261003-5cip';
  if(!slug){
    const m=window.location.pathname.match(/\/posts\/(.+)\.html$/);
    if(m)slug=m[1];
  }
  if(!slug)return;

  /* FAST-POST */
  if(typeof PREPOST!=='undefined'&&PREPOST&&PREPOST.post){
    renderPost(PREPOST.post,[...(PREPOST.related||[]),PREPOST.post]);
  }else{
    const cached=getCache();
    if(cached){
      const post=cached.find(p=>p.slug===slug);
      if(post){renderPost(post,cached);}
    }
  }

  // Always fetch fresh in background for accurate views/downloads
  try{
    const db=await getDB();
    const posts=db.posts||[];
    const post=posts.find(p=>p.slug===slug);
    if(post){
      renderPost(post,posts);
      // Track view in background
      trackView(slug);
    }
  }catch(e){}
}

init();

<script>
/* WZ-TRACK */
(function(){
  var API='https://wavzo-db.dakudinamoses.workers.dev/track';
  var host=location.hostname;
  var live=(host==='wavzo.com.ng'||host==='www.wavzo.com.ng');
  var owner=false;try{owner=!!localStorage.getItem('wz_key');}catch(e){}
  function send(ev,kind,key){
    try{
      if(!live||owner||!key||!/^[\w.\-:~%]{1,120}$/.test(key))return;
      var body=JSON.stringify({ev:ev,kind:kind,key:key,ref:document.referrer||''});
      if(navigator.sendBeacon){navigator.sendBeacon(API,new Blob([body],{type:'text/plain'}));return;}
      fetch(API,{method:'POST',body:body,keepalive:true,headers:{'Content-Type':'text/plain'}});
    }catch(e){}
  }
  window.WZ={track:send};
  function pathSlug(dir){
    var m=location.pathname.match(new RegExp('^/'+dir+'/([^/]+?)(?:\\.html)?$'));
    if(!m)return '';
    try{return decodeURIComponent(m[1]);}catch(e){return m[1];}
  }
  function wrap(name,fn){
    var old=window[name];
    if(typeof old!=='function')return;
    window[name]=function(){try{fn.apply(null,arguments);}catch(e){} return old.apply(this,arguments);};
  }
  var path=location.pathname,kind='',key='';
  if(pathSlug('posts')){kind='post';key=pathSlug('posts');}
  else if(pathSlug('songs')){kind='song';key=pathSlug('songs');}
  else if(pathSlug('artists')){kind='artist';key=pathSlug('artists');}
  else if(path==='/'||path==='/index.html'){kind='page';key='home';}
  else if(path==='/artists.html'){kind='page';key='artists';}
  if(!kind)return;
  send('view',kind,key);

  // first play of any audio/video on the page
  var played={};
  document.addEventListener('play',function(e){
    var t=e.target;if(!t||!t.tagName)return;
    var id=(t.currentSrc||t.src||t.tagName);
    if(played[id])return;played[id]=1;
    send('play',kind,key);
  },true);

  if(kind==='post'){
    wrap('trackDownload',function(){send('download','post',key);});
    wrap('sharePost',function(){send('share','post',key);});
  }
  if(kind==='song'){
    wrap('downloadMp3',function(){send('download','song',key);});
    // a tap inside the YouTube player moves focus into the iframe
    window.addEventListener('blur',function(){
      setTimeout(function(){
        var a=document.activeElement;
        if(a&&a.tagName==='IFRAME'&&!a._wz){a._wz=1;send('yt','song',key);}
      },50);
    });
  }
  // clicks on outbound links (YouTube, streaming, social)
  document.addEventListener('click',function(e){
    var a=e.target&&e.target.closest?e.target.closest('a[href]'):null;
    if(!a)return;
    var h=a.getAttribute('href')||'';
    if(!/^https?:\/\//i.test(h)||h.indexOf(host)>-1)return;
    send(/youtube\.com|youtu\.be/i.test(h)?'yt':'click',kind,key);
  },true);
  if(kind==='artist'){
    document.addEventListener('click',function(e){
      var a=e.target&&e.target.closest?e.target.closest('a[href]'):null;
      if(a&&/\/songs\//.test(a.getAttribute('href')||''))send('click','artist',key);
    },true);
  }
})();
</script>
