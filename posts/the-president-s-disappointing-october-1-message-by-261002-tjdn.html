const PREPOST={"post":{"title":"The president’s disappointing October 1 message, by Adekunle Adekoya","slug":"the-president-s-disappointing-october-1-message-by-261002-tjdn","category":"NEWS","excerpt":"NOT a few Nigerians, especially me, expected that there would be something to hold on to when the President made his speech commemorating our National Day, October 1, yesterday morning. As a newspaper","content":"\u003cp>\u003cstrong>NOT a few Nigerians, especially me, expected that there would be something to hold on to when the President made his speech commemorating our National Day, October 1, yesterday morning.\u003c/strong> As a newspaperman, I read the message more than three times, looking for that strand of a message that could give hope that at the end of the tunnel in which we have been thrown, there would be a glimmer of light, signalling hope that things would begin a turnaround for the better.\u003c/p>\n\u003cp>Alas, like so many other countrymen and women, numbering in scores of millions, it was not to be as the president opted to grandstand on what he thinks are achievements. The same old chorus, now sounding like a broken record, was recited to us — necessity of reforms, NELFUND, Credicorp, and all that. There was no talk about how we would soon pay less for petrol, diesel, cooking gas, or electricity.\u003c/p>\n\u003cp>Let me backtrack a bit. When Nigeria was Nigeria, we eagerly looked forward to October 1. As schoolchildren in the glorious 60s and 70s, every October 1, our teachers told us to come to school with our plates and spoons. Everyone of us got a plate of rice and a chunky piece of meat, with a bottle of mineral drink to drown it in. Government worked so well in those days that the headmasters of primary schools got the funds with which to prepare these meals for their pupils well ahead of time. And it was a time when there was nothing like bank transfers, internet banking. The POS operator was an alien figure. Yet, things worked. If it were now, the funds will never get to the school headmasters, and the children would never get any food.\u003c/p>\n\u003cp>That time too, was when Nigeria was arguably the most secure country in the world, compared to what now obtains. A little over 50 years ago, in April 1976, I was in Class III in secondary school. Our Geography teacher, Mr Bayo Ogunnupe, decided to organise an excursion. That excursion took us to Kainji Dam in today’s Niger State. Each of us paid 30 kobo — three 10 kobo coins for the trip, from our school, Remo Divisional High School in Sagamu, Ogun State. We went safely and returned safely, four days after we set out. If it were now, we would probably have been kidnapped, taken hostage, and ransom demanded for our return. In any case, no teacher would dream of such an excursion today, and no parent would allow his/her child/ward to participate. That is how bad things have turned out.\u003c/p>\n\u003cp>And talking about how bad things have turned out, one had hoped that the president would tell us a little of the good things he has done or plans to do to make things better. In particular, I expected a response to the threat of a warning strike by the  Joint National Public Service Negotiating Council, JNPSNC. The JPNSC is made up of eight public sector unions — the Nigerian Civil Service Union, NCSU; Medical and Health Workers Union, M&amp;HWU; Association of Senior Civil Servants of Nigeria, ASCSN; and National Association of Nigerian Nurses and Midwives, NANNM.\u003c/p>\n\u003cp>Others are the Amalgamated Union of Public Corporations, Civil Service Technical and Recreational Employees, AUPCTRE; Nigeria Union of Public Service, Reportorial, Secretarial, Data Processors and Allied Workers, NUPSRAW; National Union of Printing, Publishing and Paper Products Workers, NUPPPPROW; and the National Union of Agriculture and Allied Employees, NUAEE. On September 21, the public servants wrote to the president, beseeching him to find ways to bring the price of petrol down to N500, and also demanded a wage award, and commencement of negotiations for a new minimum national wage.\u003c/p>\n\u003cp>I support the demands of the unions, because it might make government really take action that will benefit all of us, including the insensitive ones in the corridors of power. If somehow petrol can be made to sell for N500, that would be a huge relief to all of us, rich or poor. If a new national minimum wage is negotiated, it means more cash in the bank accounts of workers and increased purchasing power, which will translate to reduced industrial inventory and other benefits to the economy. But there was no word from the president on this issue. Maybe because he had been away from the country in the last three weeks. But if it was really the working vacation we were told it was, it means the president was getting information about the things that needed his attention on a daily basis. Or the threat of strike by public servants did not need the attention of the president? In all, the optics of government’s performance, as it relates to the welfare of the governed, is rather disppointing. The disappointment is even deeper when you consider that we are in election season, a period when normal politicians should be doing anything within their power to please the people. Not so here. The contempt that those in government have for those they are governing is so thick and heavy one can almost feel it the way a porter feels the weight of a load. If not, roads would not remain potholed for months and streets get clogged with garbage for months as is the case in Lagos. Is it because these people know they will be back in office after next year’s elections, whether we vote or not? If that, why not some eye service, which will be better than no service? TGIF.\u003c/p>\n\u003cp class=\"article-source\">\u003cem>Source: \u003ca href=\"https://www.vanguardngr.com/2026/10/the-presidents-disappointing-october-1-message-by-adekunle-adekoya/\" target=\"_blank\" rel=\"noopener nofollow\">https://www.vanguardngr.com/2026/10/the-presidents-disappointing-october-1-message-by-adekunle-adekoya/\u003c/a>\u003c/em>\u003c/p>","coverImage":"https://res.cloudinary.com/smg1blzu/image/upload/v1790910609/jwbrqtndm94oenazo7g9.jpg","musicFile":null,"videoFile":null,"date":"Oct 2, 2026","createdAt":1790910608645},"related":[{"slug":"healey-says-surprise-uk-growth-is-sign-of-261015-3vpd","title":"Healey says surprise UK growth is 'sign of resilience' ahead of Budget","category":"NEWS","coverImage":"https://res.cloudinary.com/smg1blzu/image/upload/v1792065071/iorflqpqyn3st7qjhili.jpg","date":"Oct 15, 2026"},{"slug":"reform-faces-criticism-after-councillors-filmed-making-racist-261015-kyrp","title":"Reform faces criticism after councillors filmed making racist comments","category":"NEWS","coverImage":"https://res.cloudinary.com/smg1blzu/image/upload/v1792065080/t0uay0cf3ferstgqiim1.jpg","date":"Oct 15, 2026"},{"slug":"this-sparsely-populated-red-state-quietly-climbed-to-261015-ox3v","title":"This sparsely populated red state quietly climbed to the top of America's financial rankings","category":"NEWS","coverImage":"https://res.cloudinary.com/smg1blzu/image/upload/v1792065089/d4iprutnzyosytv1d6gf.png","date":"Oct 15, 2026"}]};

function getCache(){
  try{
    const c=JSON.parse(localStorage.getItem(CACHE_KEY)||'null');
    if(c)return c.posts;
  }catch(e){}
  return null;
}

async function getDB(){
  const res=await fetch(BIN_URL+'/latest',{headers:{'X-Master-Key':BIN_KEY}});
  const data=await res.json();
  return data.record||{posts:[]};
}
async function saveDB(db){
  await fetch(BIN_URL,{method:'PUT',headers:{'Content-Type':'application/json','X-Master-Key':BIN_KEY},body:JSON.stringify(db)});
  try{localStorage.setItem(CACHE_KEY,JSON.stringify({posts:[...(db.posts||[])].reverse(),ts:Date.now()}));}catch(e){}
}

async function trackView(slug){
  try{
    const db=await getDB();
    const p=db.posts.find(p=>p.slug===slug);
    if(p){
      p.views=(p.views||0)+1;
      try{
        const geo=await fetch('https://ipwho.is/').then(r=>r.json());
        const country=geo.country_code||'Unknown';
        db.countryViews=db.countryViews||{};
        db.countryViews[country]=(db.countryViews[country]||0)+1;
      }catch(e){}
      await saveDB(db);
    }
  }catch(e){}
}
async function trackDownload(slug,type){
  try{
    const db=await getDB();const p=db.posts.find(p=>p.slug===slug);
    if(p){
      p.downloads=(p.downloads||0)+1;
      if(type==='audio')p.audioDownloads=(p.audioDownloads||0)+1;
      if(type==='video')p.videoDownloads=(p.videoDownloads||0)+1;
      await saveDB(db);
    }
  }catch(e){}
}

function startDownload(url,type,slug){
  const gate=document.getElementById('dlGate');
  const btn=document.getElementById('dlFinalBtn');
  const countdown=document.getElementById('dlCountdown');
  gate.style.display='block';
  gate.scrollIntoView({behavior:'smooth'});
  btn.disabled=true;btn.textContent='Please wait...';
  let sec=5;
  countdown.textContent='Download starts in '+sec+'s';
  const timer=setInterval(()=>{
    sec--;
    if(sec<=0){
      clearInterval(timer);
      countdown.textContent='✅ Ready!';
      btn.disabled=false;btn.textContent='⬇ DOWNLOAD NOW';
      btn.onclick=()=>{trackDownload(slug,type);const a=document.createElement('a');a.href=url;a.download='';a.click();};
    } else {
      countdown.textContent='Download starts in '+sec+'s';
    }
  },1000);
}

function sharePost(platform){
  let slug=new URLSearchParams(window.location.search).get('slug')||'';
  if(!slug){const m=window.location.pathname.match(/\/posts\/([^\/]+?)(?:\.html)?$/);if(m)slug=decodeURIComponent(m[1]);}
  const staticUrl='https://wavzo.com.ng/posts/'+encodeURIComponent(slug)+'.html';
  const url=encodeURIComponent(staticUrl);
  const title=encodeURIComponent(document.title);
  if(platform==='whatsapp')window.open('https://wa.me/?text='+title+'%20'+url);
  else if(platform==='twitter')window.open('https://twitter.com/intent/tweet?text='+title+'&url='+url);
  else if(platform==='copy'){navigator.clipboard.writeText(staticUrl);alert('Link copied!');}
}

function escapeHtml(str){
  const div=document.createElement('div');
  div.textContent=str;
  return div.innerHTML;
}

function renderCommentsHTML(comments,slug){
  if(!comments||!comments.length)return '<p style="color:#666;font-size:13px;padding:10px 0">No comments yet. Be the first!</p>';
  return comments.map(c=>`
    <div class="comment-item">
      <div class="comment-header"><strong>${escapeHtml(c.name||'Anonymous')}</strong><span class="comment-date">${new Date(c.ts).toLocaleDateString()}</span></div>
      <p class="comment-text">${escapeHtml(c.text)}</p>
      <div class="comment-actions">
        <button onclick="likeComment('${slug}','${c.id}')">👍 ${c.likes||0}</button>
        <button onclick="toggleReplyForm('${c.id}')">Reply</button>
      </div>
      <div class="reply-form hidden" id="replyForm-${c.id}">
        <input type="text" id="replyName-${c.id}" placeholder="Your name">
        <textarea id="replyText-${c.id}" placeholder="Write a reply..."></textarea>
        <button class="dw-btn" style="padding:6px 14px;font-size:12px" onclick="postReply('${slug}','${c.id}')">Reply</button>
      </div>
      ${(c.replies&&c.replies.length)?`<div class="replies-list">${c.replies.map(r=>`
        <div class="reply-item">
          <div class="comment-header"><strong>${escapeHtml(r.name||'Anonymous')}</strong><span class="comment-date">${new Date(r.ts).toLocaleDateString()}</span></div>
          <p class="comment-text">${escapeHtml(r.text)}</p>
          <div class="comment-actions"><button onclick="likeReply('${slug}','${c.id}','${r.id}')">👍 ${r.likes||0}</button></div>
        </div>
      `).join('')}</div>`:''}
    </div>
  `).join('');
}

async function refreshComments(slug){
  const db=await getDB();
  const post=db.posts.find(p=>p.slug===slug);
  if(!post)return;
  document.getElementById('commentsList').innerHTML=renderCommentsHTML(post.comments||[],slug);
  document.getElementById('commentCount').textContent=(post.comments||[]).length;
}

async function postComment(slug){
  const nameEl=document.getElementById('commentName');
  const textEl=document.getElementById('commentText');
  const name=nameEl.value.trim()||'Anonymous';
  const text=textEl.value.trim();
  if(!text)return;
  const db=await getDB();
  const post=db.posts.find(p=>p.slug===slug);
  if(!post)return;
  post.comments=post.comments||[];
  post.comments.push({id:'c'+Date.now()+Math.random().toString(36).slice(2,6),name,text,ts:Date.now(),likes:0,replies:[]});
  await saveDB(db);
  textEl.value='';
  await refreshComments(slug);
}

function toggleReplyForm(commentId){
  const form=document.getElementById('replyForm-'+commentId);
  if(form)form.classList.toggle('hidden');
}

async function postReply(slug,commentId){
  const nameEl=document.getElementById('replyName-'+commentId);
  const textEl=document.getElementById('replyText-'+commentId);
  const name=nameEl.value.trim()||'Anonymous';
  const text=textEl.value.trim();
  if(!text)return;
  const db=await getDB();
  const post=db.posts.find(p=>p.slug===slug);
  if(!post)return;
  const comment=(post.comments||[]).find(c=>c.id===commentId);
  if(!comment)return;
  comment.replies=comment.replies||[];
  comment.replies.push({id:'r'+Date.now()+Math.random().toString(36).slice(2,6),name,text,ts:Date.now(),likes:0});
  await saveDB(db);
  await refreshComments(slug);
}

async function likeComment(slug,commentId){
  const db=await getDB();
  const post=db.posts.find(p=>p.slug===slug);
  if(!post)return;
  const comment=(post.comments||[]).find(c=>c.id===commentId);
  if(!comment)return;
  comment.likes=(comment.likes||0)+1;
  await saveDB(db);
  await refreshComments(slug);
}

async function likeReply(slug,commentId,replyId){
  const db=await getDB();
  const post=db.posts.find(p=>p.slug===slug);
  if(!post)return;
  const comment=(post.comments||[]).find(c=>c.id===commentId);
  if(!comment)return;
  const reply=(comment.replies||[]).find(r=>r.id===replyId);
  if(!reply)return;
  reply.likes=(reply.likes||0)+1;
  await saveDB(db);
  await refreshComments(slug);
}

const REACTIONS=[
  {key:'like',emoji:'👍'},
  {key:'love',emoji:'❤️'},
  {key:'laugh',emoji:'😂'},
  {key:'wow',emoji:'😮'},
  {key:'sad',emoji:'😢'},
];

function getMyReaction(slug){
  try{return localStorage.getItem('pw_reaction_'+slug);}catch(e){return null;}
}
function setMyReaction(slug,key){
  try{localStorage.setItem('pw_reaction_'+slug,key);}catch(e){}
}

function renderReactionsHTML(reactions,slug){
  const mine=getMyReaction(slug);
  return REACTIONS.map(r=>`
    <button class="reaction-btn ${mine===r.key?'active':''}" onclick="toggleReaction('${slug}','${r.key}')">
      ${r.emoji} <span>${(reactions&&reactions[r.key])||0}</span>
    </button>
  `).join('');
}

async function refreshReactions(slug){
  const db=await getDB();
  const post=db.posts.find(p=>p.slug===slug);
  if(!post)return;
  document.getElementById('reactionsBar').innerHTML=renderReactionsHTML(post.reactions||{},slug);
}

async function toggleReaction(slug,key){
  const db=await getDB();
  const post=db.posts.find(p=>p.slug===slug);
  if(!post)return;
  post.reactions=post.reactions||{};
  const mine=getMyReaction(slug);

  if(mine===key){
    // un-react
    post.reactions[key]=Math.max(0,(post.reactions[key]||0)-1);
    setMyReaction(slug,'');
  } else {
    if(mine)post.reactions[mine]=Math.max(0,(post.reactions[mine]||0)-1);
    post.reactions[key]=(post.reactions[key]||0)+1;
    setMyReaction(slug,key);
  }

  await saveDB(db);
  await refreshReactions(slug);
}

async function init(){
  const slug='the-president-s-disappointing-october-1-message-by-261002-tjdn';
  if(!slug){
    const m=window.location.pathname.match(/\/posts\/(.+)\.html$/);
    if(m)slug=m[1];
  }
  if(!slug)return;

  /* FAST-POST */
  if(typeof PREPOST!=='undefined'&&PREPOST&&PREPOST.post){
    renderPost(PREPOST.post,[...(PREPOST.related||[]),PREPOST.post]);
  }else{
    const cached=getCache();
    if(cached){
      const post=cached.find(p=>p.slug===slug);
      if(post){renderPost(post,cached);}
    }
  }

  // Always fetch fresh in background for accurate views/downloads
  try{
    const db=await getDB();
    const posts=db.posts||[];
    const post=posts.find(p=>p.slug===slug);
    if(post){
      renderPost(post,posts);
      // Track view in background
      trackView(slug);
    }
  }catch(e){}
}

init();

<script>
/* WZ-TRACK */
(function(){
  var API='https://wavzo-db.dakudinamoses.workers.dev/track';
  var host=location.hostname;
  var live=(host==='wavzo.com.ng'||host==='www.wavzo.com.ng');
  var owner=false;try{owner=!!localStorage.getItem('wz_key');}catch(e){}
  function send(ev,kind,key){
    try{
      if(!live||owner||!key||!/^[\w.\-:~%]{1,120}$/.test(key))return;
      var body=JSON.stringify({ev:ev,kind:kind,key:key,ref:document.referrer||''});
      if(navigator.sendBeacon){navigator.sendBeacon(API,new Blob([body],{type:'text/plain'}));return;}
      fetch(API,{method:'POST',body:body,keepalive:true,headers:{'Content-Type':'text/plain'}});
    }catch(e){}
  }
  window.WZ={track:send};
  function pathSlug(dir){
    var m=location.pathname.match(new RegExp('^/'+dir+'/([^/]+?)(?:\\.html)?$'));
    if(!m)return '';
    try{return decodeURIComponent(m[1]);}catch(e){return m[1];}
  }
  function wrap(name,fn){
    var old=window[name];
    if(typeof old!=='function')return;
    window[name]=function(){try{fn.apply(null,arguments);}catch(e){} return old.apply(this,arguments);};
  }
  var path=location.pathname,kind='',key='';
  if(pathSlug('posts')){kind='post';key=pathSlug('posts');}
  else if(pathSlug('songs')){kind='song';key=pathSlug('songs');}
  else if(pathSlug('artists')){kind='artist';key=pathSlug('artists');}
  else if(path==='/'||path==='/index.html'){kind='page';key='home';}
  else if(path==='/artists.html'){kind='page';key='artists';}
  if(!kind)return;
  send('view',kind,key);

  // first play of any audio/video on the page
  var played={};
  document.addEventListener('play',function(e){
    var t=e.target;if(!t||!t.tagName)return;
    var id=(t.currentSrc||t.src||t.tagName);
    if(played[id])return;played[id]=1;
    send('play',kind,key);
  },true);

  if(kind==='post'){
    wrap('trackDownload',function(){send('download','post',key);});
    wrap('sharePost',function(){send('share','post',key);});
  }
  if(kind==='song'){
    wrap('downloadMp3',function(){send('download','song',key);});
    // a tap inside the YouTube player moves focus into the iframe
    window.addEventListener('blur',function(){
      setTimeout(function(){
        var a=document.activeElement;
        if(a&&a.tagName==='IFRAME'&&!a._wz){a._wz=1;send('yt','song',key);}
      },50);
    });
  }
  // clicks on outbound links (YouTube, streaming, social)
  document.addEventListener('click',function(e){
    var a=e.target&&e.target.closest?e.target.closest('a[href]'):null;
    if(!a)return;
    var h=a.getAttribute('href')||'';
    if(!/^https?:\/\//i.test(h)||h.indexOf(host)>-1)return;
    send(/youtube\.com|youtu\.be/i.test(h)?'yt':'click',kind,key);
  },true);
  if(kind==='artist'){
    document.addEventListener('click',function(e){
      var a=e.target&&e.target.closest?e.target.closest('a[href]'):null;
      if(a&&/\/songs\//.test(a.getAttribute('href')||''))send('click','artist',key);
    },true);
  }
})();
</script>
