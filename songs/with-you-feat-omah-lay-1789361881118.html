<script>
const BIN_ID='6aa50e3aac6210605ac3c542';
const BIN_KEY='public';
const BIN_URL='https://wavzo-db.dakudinamoses.workers.dev/v3/b/'+BIN_ID;
const songId='song-1789361881120';
const PRE={"song": {"id": "song-1789361881120", "title": "With You (feat. Omah Lay)", "artistId": "art-1789345277107", "type": "Single", "excerpt": "From the release \"5ive\" by Davido (2025).", "downloadUrl": "https://res.cloudinary.com/smg1blzu/video/upload/l_video:pulsewire-tag-v2,fl_splice,du_4/fl_layer_apply/With You (feat. Omah Lay).mp3", "youtubeUrl": "https://www.youtube.com/watch?v=XCjU9qbfv1U", "cover": "https://is1-ssl.mzstatic.com/image/thumb/Music211/v4/cd/0c/91/cd0c917a-e1a0-2592-a3a1-529796e19ea9/196872682564.jpg/1000x1000bb.jpg", "slug": "with-you-feat-omah-lay-1789361881118", "createdAt": 1789361881120}, "artist": {"id": "art-1789345277107", "name": "Davido", "genre": "Afrobeats", "bio": "David Adedeji Adeleke, known professionally as Davido, is a Nigerian-American singer, songwriter, and record producer. Davido was born in Atlanta, U.S, and raised in Lagos, Nigeria. He made his music debut as a member of the group KB International. Davido studied business administration at Oakwood University before dropping out to make beats and record vocal references. He rose to fame after releasing \"Dami Duro\", the second single from his debut studio album Omo Baba Olowo (2012), from which six additional singles—\"Back When\", \"Ekuro\", \"Overseas\", \"All of You\", \"Gbon Gbon\" and \"Feel Alright\"—were taken. In 2012, Davido won the Next Rated award at The Headies. Between 2013 and 2015, he released the singles \"Gobe\", \"One of a Kind\", \"Skelewu\", \"Aye\", \"Tchelete (Goodlife)\", \"Naughty\", \"Owo Ni Koko\", \"The Sound\" and \"The Money\".", "slug": "davido", "photo": "https://upload.wikimedia.org/wikipedia/commons/7/77/Davido_2024_%28cropped%29.jpg?utm_source=en.wikipedia.org&utm_campaign=api&utm_content=thumbnail_unscaled"}, "titles": ["Holy Ghost | Emma D Moses", "Reform receives record £36m donation from crypto billionaire", "Burnham and Badenoch revive red versus blue politics as Reform land 'gobsmacking' donation", "Lightning Houthi advance in Yemen may bring dangerous new dimension to Iran war", "Masked men, lorries and road blocks: How anti-migrant activists are changing tactics", "Trump says united Ireland would be 'fantastic' during visit to Dublin"]};

function youtubeId(url){
  const m=url.match(/(?:youtu\.be\/|v=)([a-zA-Z0-9_-]{11})/);
  return m?m[1]:null;
}

async function init(){
  /* FAST-SONG */
  let db;
  if(typeof PRE!=='undefined'&&PRE&&PRE.song){
    db={songs:[PRE.song],artists:PRE.artist?[PRE.artist]:[],posts:(PRE.titles||[]).map(t=>({title:t}))};
  }else{
    const res=await fetch(BIN_URL+'/latest',{headers:{'X-Master-Key':BIN_KEY}});
    const data=await res.json();
    db=data.record||{};
  }
  const song=(db.songs||[]).find(s=>s.id===songId);
  if(!song)return;
  const artist=(db.artists||[]).find(a=>a.id===song.artistId);

  document.getElementById('songType').textContent=song.type;
  document.getElementById('songTitle').textContent=song.title;
  document.getElementById('songExcerpt').textContent=song.excerpt||'';
  if(song.cover)document.getElementById('songCover').src=song.cover;

  if(artist){
    document.getElementById('crumbArtist').textContent=artist.name;
    const link=document.getElementById('artistLink');
    link.textContent='by '+artist.name;
    link.href='/artists/'+artist.slug+'.html';
    document.getElementById('backToArtist').href='/artists/'+artist.slug+'.html';
    document.getElementById('backToArtist').innerHTML='&larr; Back to '+artist.name;
  }

  if(song.downloadUrl){
    document.getElementById('downloadBlock').style.display='block';
    window._songData = { audioUrl: song.downloadUrl, artist: artist?artist.name:'Unknown Artist', title: song.title, year: song.year||'', genre: song.genre||artist?.genre||'', coverUrl: song.cover||'' };
  }
  if(song.youtubeUrl){
    const vid=youtubeId(song.youtubeUrl);
    if(vid){
      document.getElementById('videoBlock').style.display='block';
      document.getElementById('videoEmbed').innerHTML=`<iframe width="100%" height="380" style="border-radius:6px;border:none" src="https://www.youtube.com/embed/${vid}" allowfullscreen></iframe>`;
    }
  }

  const track=document.getElementById('tickerTrack');
  [...(db.posts||[]).slice(0,6),...(db.posts||[]).slice(0,6)].forEach(p=>{const s=document.createElement('span');s.textContent=p.title;track.appendChild(s);});
}
async function downloadMp3(){
  const btn=document.getElementById('downloadMp3Btn');
  const status=document.getElementById('downloadStatus');
  if(!window._songData){status.textContent='Nothing to download.';return;}
  btn.disabled=true;btn.textContent='Converting...';status.textContent='Processing audio — this may take a moment for longer tracks.';
  try{
    const res=await fetch('/api/download-mp3',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(window._songData)
    });
    if(!res.ok){
      const err=await res.json().catch(()=>({error:'Download failed'}));
      throw new Error(err.error||'Download failed');
    }
    const blob=await res.blob();
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download=`${window._songData.artist} - ${window._songData.title}.mp3`.replace(/[\/\\:*?"<>|]/g,'');
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    status.textContent='✓ Download started';
  }catch(e){
    status.textContent='Error: '+e.message;
  }
  btn.disabled=false;btn.textContent='⬇ Download MP3';
}

init();
window.addEventListener('scroll',()=>{document.getElementById('siteNav').classList.toggle('scrolled',window.scrollY>10);});
</script>
