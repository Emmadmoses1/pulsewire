<script>
const BIN_ID='6aa50e3aac6210605ac3c542';
const BIN_KEY='public';
const BIN_URL='https://wavzo-db.dakudinamoses.workers.dev/v3/b/'+BIN_ID;
const artistId='art-1789886445802';
const PREART={"artist": {"id": "art-1789886445802", "name": "Lil Durk", "genre": "Hip-Hop", "bio": "Durk Devontay Banks, known professionally as Lil Durk, is an American rapper. Regarded as a pioneer of the Chicago-based hip-hop subgenre drill music, he is often considered the subgenre's most commercially successful rapper. He initially garnered local success with the release of his Signed to the Streets mixtape series (2013–2014), which led to him to sign with Def Jam Recordings. The label released his debut studio album, Remember My Name (2015), and its follow-up, Lil Durk 2X (2016), to moderate commercial reception before parting ways with the rapper in 2018.", "slug": "lil-durk", "photo": "https://upload.wikimedia.org/wikipedia/commons/0/01/Lil_Durk_in_2022.png?utm_source=en.wikipedia.org&utm_campaign=api&utm_content=thumbnail_unscaled"}, "songs": [], "titles": ["Holy Ghost | Emma D Moses", "Reform receives record £36m donation from crypto billionaire", "Burnham and Badenoch revive red versus blue politics as Reform land 'gobsmacking' donation", "Lightning Houthi advance in Yemen may bring dangerous new dimension to Iran war", "Masked men, lorries and road blocks: How anti-migrant activists are changing tactics", "Trump says united Ireland would be 'fantastic' during visit to Dublin"]};

async function init(){
  /* FAST-ARTIST */
  let db;
  if(typeof PREART!=='undefined'&&PREART&&PREART.artist){
    db={artists:[PREART.artist],songs:PREART.songs||[],posts:(PREART.titles||[]).map(t=>({title:t}))};
  }else{
    const res=await fetch(BIN_URL+'/latest',{headers:{'X-Master-Key':BIN_KEY}});
    const data=await res.json();
    db=data.record||{};
  }
  const artist=(db.artists||[]).find(a=>a.id===artistId);
  if(!artist)return;

  document.getElementById('crumbArtist').textContent=artist.name;
  document.getElementById('artistName').textContent=artist.name;
  document.getElementById('artistGenre').textContent=artist.genre||'';
  document.getElementById('artistBio').textContent=artist.bio||'';
  if(artist.photo){
    const img=document.getElementById('artistPhoto');
    img.src=artist.photo;
    img.style.display='block';
  }

  const songs=(db.songs||[]).filter(s=>s.artistId===artistId);
  if(songs.length){
    const list=document.getElementById('artistSongsList');
    document.getElementById('songsBlock').style.display='block';
    songs.forEach(s=>{
      const a=document.createElement('a');
      a.href='/songs/'+s.slug+'.html';
      a.style.cssText='display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;padding:8px;border:1px solid #eee;border-radius:6px';
      a.innerHTML=(s.cover?`<img src="${s.cover}" style="width:48px;height:48px;object-fit:cover;border-radius:4px">`:'')+
        `<span style="font-weight:600">${s.title}</span>`;
      list.appendChild(a);
    });
  }

  const track=document.getElementById('tickerTrack');
  [...(db.posts||[]).slice(0,6),...(db.posts||[]).slice(0,6)].forEach(p=>{const t=document.createElement('span');t.textContent=p.title;track.appendChild(t);});
}
init();
window.addEventListener('scroll',()=>{document.getElementById('siteNav').classList.toggle('scrolled',window.scrollY>10);});
</script>
