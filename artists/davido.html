<script>
const BIN_ID='6aa50e3aac6210605ac3c542';
const BIN_KEY='public';
const BIN_URL='https://wavzo-db.dakudinamoses.workers.dev/v3/b/'+BIN_ID;
const artistId='art-1789345277107';
const PREART={"artist": {"id": "art-1789345277107", "name": "Davido", "genre": "Afrobeats", "bio": "David Adedeji Adeleke, known professionally as Davido, is a Nigerian-American singer, songwriter, and record producer. Davido was born in Atlanta, U.S, and raised in Lagos, Nigeria. He made his music debut as a member of the group KB International. Davido studied business administration at Oakwood University before dropping out to make beats and record vocal references. He rose to fame after releasing \"Dami Duro\", the second single from his debut studio album Omo Baba Olowo (2012), from which six additional singles—\"Back When\", \"Ekuro\", \"Overseas\", \"All of You\", \"Gbon Gbon\" and \"Feel Alright\"—were taken. In 2012, Davido won the Next Rated award at The Headies. Between 2013 and 2015, he released the singles \"Gobe\", \"One of a Kind\", \"Skelewu\", \"Aye\", \"Tchelete (Goodlife)\", \"Naughty\", \"Owo Ni Koko\", \"The Sound\" and \"The Money\".", "slug": "davido", "photo": "https://upload.wikimedia.org/wikipedia/commons/7/77/Davido_2024_%28cropped%29.jpg?utm_source=en.wikipedia.org&utm_campaign=api&utm_content=thumbnail_unscaled"}, "songs": [{"id": "song-1789361881120", "title": "With You (feat. Omah Lay)", "artistId": "art-1789345277107", "type": "Single", "excerpt": "From the release \"5ive\" by Davido (2025).", "downloadUrl": "https://res.cloudinary.com/smg1blzu/video/upload/l_video:pulsewire-tag-v2,fl_splice,du_4/fl_layer_apply/With You (feat. Omah Lay).mp3", "youtubeUrl": "https://www.youtube.com/watch?v=XCjU9qbfv1U", "cover": "https://is1-ssl.mzstatic.com/image/thumb/Music211/v4/cd/0c/91/cd0c917a-e1a0-2592-a3a1-529796e19ea9/196872682564.jpg/1000x1000bb.jpg", "slug": "with-you-feat-omah-lay-1789361881118", "createdAt": 1789361881120}, {"id": "song-1789720934184", "title": "B4 B4", "artistId": "art-1789345277107", "type": "Single", "excerpt": "From the release \"Oriadé\" by Davido, FOLA & Mayorkun (2026).", "downloadUrl": "https://res.cloudinary.com/smg1blzu/video/upload/l_video:wavzo-tag-v1,fl_splice,e_volume:200/fl_layer_apply,so_0,du_3/b4-b4-1789720902572.mp3", "youtubeUrl": "https://www.youtube.com/watch?v=rRjtTx49hkc", "cover": "https://is1-ssl.mzstatic.com/image/thumb/Music221/v4/a8/fb/21/a8fb21ed-2106-199e-75dc-f01099c29394/196874507544.jpg/1000x1000bb.jpg", "slug": "b4-b4-1789720934183", "createdAt": 1789720934184}], "titles": ["Holy Ghost | Emma D Moses", "Reform receives record £36m donation from crypto billionaire", "Burnham and Badenoch revive red versus blue politics as Reform land 'gobsmacking' donation", "Lightning Houthi advance in Yemen may bring dangerous new dimension to Iran war", "Masked men, lorries and road blocks: How anti-migrant activists are changing tactics", "Trump says united Ireland would be 'fantastic' during visit to Dublin"]};

async function init(){
  /* FAST-ARTIST */
  let db;
  if(typeof PREART!=='undefined'&&PREART&&PREART.artist){
    db={artists:[PREART.artist],songs:PREART.songs||[],posts:(PREART.titles||[]).map(t=>({title:t}))};
  }else{
    const res=await fetch(BIN_URL+'/latest',{headers:{'X-Master-Key':BIN_KEY}});
    const data=await res.json();
    db=data.record||{};
  }
  const artist=(db.artists||[]).find(a=>a.id===artistId);
  if(!artist)return;

  document.getElementById('crumbArtist').textContent=artist.name;
  document.getElementById('artistName').textContent=artist.name;
  document.getElementById('artistGenre').textContent=artist.genre||'';
  document.getElementById('artistBio').textContent=artist.bio||'';
  if(artist.photo){
    const img=document.getElementById('artistPhoto');
    img.src=artist.photo;
    img.style.display='block';
  }

  const songs=(db.songs||[]).filter(s=>s.artistId===artistId);
  if(songs.length){
    const list=document.getElementById('artistSongsList');
    document.getElementById('songsBlock').style.display='block';
    songs.forEach(s=>{
      const a=document.createElement('a');
      a.href='/songs/'+s.slug+'.html';
      a.style.cssText='display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;padding:8px;border:1px solid #eee;border-radius:6px';
      a.innerHTML=(s.cover?`<img src="${s.cover}" style="width:48px;height:48px;object-fit:cover;border-radius:4px">`:'')+
        `<span style="font-weight:600">${s.title}</span>`;
      list.appendChild(a);
    });
  }

  const track=document.getElementById('tickerTrack');
  [...(db.posts||[]).slice(0,6),...(db.posts||[]).slice(0,6)].forEach(p=>{const t=document.createElement('span');t.textContent=p.title;track.appendChild(t);});
}
init();
window.addEventListener('scroll',()=>{document.getElementById('siteNav').classList.toggle('scrolled',window.scrollY>10);});
</script>
