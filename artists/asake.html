<script>
/* FAST-IMG */
function IMG(u,w){
  try{
    if(!u||!/^https?:\/\//i.test(u)||u.indexOf('wsrv.nl')>-1)return u;
    var m=u.match(/^(https?:\/\/res\.cloudinary\.com\/[^\/]+\/image\/upload\/)(v\d+\/.*)$/);
    if(m)return m[1]+'f_auto,q_auto,w_'+w+'/'+m[2];
    return 'https://wsrv.nl/?url='+encodeURIComponent(u)+'&w='+w+'&output=webp&q=75&we';
  }catch(e){return u;}
}
function IMGFB(el){el.onerror=null;if(el.dataset&&el.dataset.o)el.src=el.dataset.o;}
const BIN_ID='6aa50e3aac6210605ac3c542';
const BIN_KEY='public';
const BIN_URL='https://wavzo-db.dakudinamoses.workers.dev/v3/b/'+BIN_ID;
const artistId='art-1789725228554';
const PREART={"artist": {"id": "art-1789725228554", "name": "Asake", "genre": "Afrobeats", "bio": "Ahmed Ololade, known professionally as Asake, is a Nigerian singer, rapper, and songwriter. His debut album, Mr. Money with the Vibe (2022) broke the record for the biggest opening day for an African album on Apple Music at the time and debuted at number 66 on the Billboard 200 chart. His second album Work of Art (2023), matched the chart position of its predecessor. Asake's third album Lungu Boy (2024) became his third consecutive number one album in Nigeria and the longest-running number one in Nigeria chart history.", "slug": "asake", "photo": "https://upload.wikimedia.org/wikipedia/commons/7/75/ASAKE.jpg?utm_source=en.wikipedia.org&utm_campaign=api&utm_content=thumbnail_unscaled"}, "songs": [{"id": "song-1789725372871", "title": "Bust Down (feat. Asake)", "artistId": "art-1789725228554", "type": "Single", "excerpt": "From the release \"Bust Down (feat. Asake) - Single\" by Zlatan (2024).", "downloadUrl": "https://res.cloudinary.com/smg1blzu/video/upload/l_video:wavzo-tag-v1,fl_splice,e_volume:200/fl_layer_apply,so_0,du_3/bust-down--feat--asake--1789725295011.mp3", "youtubeUrl": "https://www.youtube.com/watch?v=0ycogL4hY04", "cover": "https://is1-ssl.mzstatic.com/image/thumb/Music126/v4/2e/24/30/2e24303f-2260-c34f-ea18-6112c73f3f86/0.jpg/1000x1000bb.jpg", "slug": "bust-down-feat-asake-1789725372871", "createdAt": 1789725372871}], "titles": ["Holy Ghost | Emma D Moses", "Reform receives record £36m donation from crypto billionaire", "Burnham and Badenoch revive red versus blue politics as Reform land 'gobsmacking' donation", "Lightning Houthi advance in Yemen may bring dangerous new dimension to Iran war", "Masked men, lorries and road blocks: How anti-migrant activists are changing tactics", "Trump says united Ireland would be 'fantastic' during visit to Dublin"]};

async function init(){
  /* FAST-ARTIST */
  let db;
  if(typeof PREART!=='undefined'&&PREART&&PREART.artist){
    db={artists:[PREART.artist],songs:PREART.songs||[],posts:(PREART.titles||[]).map(t=>({title:t}))};
  }else{
    const res=await fetch(BIN_URL+'/latest',{headers:{'X-Master-Key':BIN_KEY}});
    const data=await res.json();
    db=data.record||{};
  }
  const artist=(db.artists||[]).find(a=>a.id===artistId);
  if(!artist)return;

  document.getElementById('crumbArtist').textContent=artist.name;
  document.getElementById('artistName').textContent=artist.name;
  document.getElementById('artistGenre').textContent=artist.genre||'';
  document.getElementById('artistBio').textContent=artist.bio||'';
  if(artist.photo){
    const img=document.getElementById('artistPhoto');
    img.dataset.o=artist.photo;img.onerror=function(){IMGFB(img)};img.src=IMG(artist.photo,640);
    img.style.display='block';
  }

  const songs=(db.songs||[]).filter(s=>s.artistId===artistId);
  if(songs.length){
    const list=document.getElementById('artistSongsList');
    document.getElementById('songsBlock').style.display='block';
    songs.forEach(s=>{
      const a=document.createElement('a');
      a.href='/songs/'+s.slug+'.html';
      a.style.cssText='display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;padding:8px;border:1px solid #eee;border-radius:6px';
      a.innerHTML=(s.cover?`<img src="${IMG(s.cover,160)}" data-o="${s.cover}" onerror="IMGFB(this)" style="width:48px;height:48px;object-fit:cover;border-radius:4px">`:'')+
        `<span style="font-weight:600">${s.title}</span>`;
      list.appendChild(a);
    });
  }

  const track=document.getElementById('tickerTrack');
  [...(db.posts||[]).slice(0,6),...(db.posts||[]).slice(0,6)].forEach(p=>{const t=document.createElement('span');t.textContent=p.title;track.appendChild(t);});
}
init();
window.addEventListener('scroll',()=>{document.getElementById('siteNav').classList.toggle('scrolled',window.scrollY>10);});
</script>
