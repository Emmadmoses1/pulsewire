<script>
/* FAST-IMG */
function IMG(u,w){
  try{
    if(!u||!/^https?:\/\//i.test(u)||u.indexOf('wsrv.nl')>-1)return u;
    var m=u.match(/^(https?:\/\/res\.cloudinary\.com\/[^\/]+\/image\/upload\/)(v\d+\/.*)$/);
    if(m)return m[1]+'f_auto,q_auto,w_'+w+'/'+m[2];
    return 'https://wsrv.nl/?url='+encodeURIComponent(u)+'&w='+w+'&output=webp&q=75&we';
  }catch(e){return u;}
}
function IMGFB(el){el.onerror=null;if(el.dataset&&el.dataset.o)el.src=el.dataset.o;}
const BIN_ID='6aa50e3aac6210605ac3c542';
const BIN_KEY='public';
const BIN_URL='https://wavzo-db.dakudinamoses.workers.dev/v3/b/'+BIN_ID;
const artistId='art-1789367524925';
const PREART={"artist": {"id": "art-1789367524925", "name": "Wizkid", "genre": "Afrobeats", "bio": "Ayodeji Ibrahim Balogun, known professionally as Wizkid, is a Nigerian singer and songwriter. Born in the Ojuelegba suburb of Surulere, Lagos, Wizkid is a voice in the emerging Afrobeats movement. His music is a blend of Afrobeats, afropop, R&B, afrobeat, reggae, dancehall, and pop. He began recording music at the age of 11 and released a collaborative album with the Glorious Five, a group he and a few of his church friends formed. In 2009, Wizkid signed a record deal with Banky W's Empire Mates Entertainment (E.M.E). He gained recognition after releasing \"Holla at Your Boy\", the lead single from his debut studio album, Superstar (2011), which also spawned the singles \"Tease Me/Bad Guys\" and \"Don't Dull\".", "slug": "wizkid", "photo": "https://upload.wikimedia.org/wikipedia/commons/b/b6/Artworks-UWHjOik17qMFy0Sb-64tibA-t500x500.jpg?utm_source=en.wikipedia.org&utm_campaign=api&utm_content=thumbnail_unscaled"}, "songs": [{"id": "song-1789372033709", "title": "MONEY CONSTANT", "artistId": "art-1789367524925", "type": "Single", "excerpt": "From the release \"SOUTH GIDI - Single\" by DJ Maphorisa, DJ Tunez, Wizkid & Mavo (2025).", "downloadUrl": "https://res.cloudinary.com/smg1blzu/video/upload/l_video:pulsewire-tag-v2,fl_splice,e_volume:200/fl_layer_apply,so_0/MONEY CONSTANT.mp3", "youtubeUrl": "https://www.youtube.com/watch?v=PwhyTsGW7_c", "cover": "https://is1-ssl.mzstatic.com/image/thumb/Music221/v4/62/36/e8/6236e8a3-c34e-fcb0-c3e7-0a41db66c6ad/196873749570.jpg/1000x1000bb.jpg", "slug": "money-constant-1789372033709", "createdAt": 1789372033709}, {"id": "song-1789397637954", "title": "Jogodo", "artistId": "art-1789367524925", "type": "Single", "excerpt": "From the release \"REAL, Vol. 1 - EP\" by Wizkid & Asake (2026).", "downloadUrl": "https://res.cloudinary.com/smg1blzu/video/upload/l_video:wavzo-tag-v1,fl_splice,e_volume:200/fl_layer_apply,so_0,du_3/jogodo-1789718996675.mp3", "youtubeUrl": "https://www.youtube.com/watch?v=4IuUYpS9RjE", "cover": "https://is1-ssl.mzstatic.com/image/thumb/Music221/v4/f0/d9/fb/f0d9fbd9-4fb2-0b9f-4178-97c2b865f22d/199316437584_cover.jpg/1000x1000bb.jpg", "slug": "jogodo-1789397637952", "createdAt": 1789397637954}, {"id": "song-1789954024678", "title": "Essence (feat. Tems)", "artistId": "art-1789367524925", "type": "Single", "excerpt": "From the release \"Made In Lagos\" by Wizkid (2020).", "downloadUrl": "https://res.cloudinary.com/smg1blzu/video/upload/v1789954019/cuvwh5dufz8qwkuy9y5i.mp3", "youtubeUrl": "https://www.youtube.com/watch?v=jipQpjUA_o8", "cover": "https://is1-ssl.mzstatic.com/image/thumb/Music115/v4/b0/09/8e/b0098ed0-ef53-f2b5-386a-c8e6181f3c8a/886448775256.jpg/1000x1000bb.jpg", "slug": "essence-feat-tems-1789954024677", "createdAt": 1789954024678}, {"id": "song-1789973994269", "title": "Joro", "artistId": "art-1789367524925", "type": "Single", "excerpt": "From the release \"Joro - Single\" by Wizkid (2019).", "downloadUrl": "https://res.cloudinary.com/smg1blzu/video/upload/v1789973955/oqjib8t4czhxolwo72qx.mp3", "youtubeUrl": "https://www.youtube.com/watch?v=FCUk7rIBBAE", "cover": "https://is1-ssl.mzstatic.com/image/thumb/Music113/v4/20/05/17/200517ab-c3a3-b833-74b3-9bb3399c780c/886447834886.jpg/1000x1000bb.jpg", "slug": "joro-1789973994268", "createdAt": 1789973994269}], "titles": ["Holy Ghost | Emma D Moses", "Reform receives record £36m donation from crypto billionaire", "Burnham and Badenoch revive red versus blue politics as Reform land 'gobsmacking' donation", "Lightning Houthi advance in Yemen may bring dangerous new dimension to Iran war", "Masked men, lorries and road blocks: How anti-migrant activists are changing tactics", "Trump says united Ireland would be 'fantastic' during visit to Dublin"]};

async function init(){
  /* FAST-ARTIST */
  let db;
  if(typeof PREART!=='undefined'&&PREART&&PREART.artist){
    db={artists:[PREART.artist],songs:PREART.songs||[],posts:(PREART.titles||[]).map(t=>({title:t}))};
  }else{
    const res=await fetch(BIN_URL+'/latest',{headers:{'X-Master-Key':BIN_KEY}});
    const data=await res.json();
    db=data.record||{};
  }
  const artist=(db.artists||[]).find(a=>a.id===artistId);
  if(!artist)return;

  document.getElementById('crumbArtist').textContent=artist.name;
  document.getElementById('artistName').textContent=artist.name;
  document.getElementById('artistGenre').textContent=artist.genre||'';
  document.getElementById('artistBio').textContent=artist.bio||'';
  if(artist.photo){
    const img=document.getElementById('artistPhoto');
    img.dataset.o=artist.photo;img.onerror=function(){IMGFB(img)};img.src=IMG(artist.photo,640);
    img.style.display='block';
  }

  /* ALBUM-MODAL */
  const songs=(db.songs||[]).filter(s=>s.artistId===artistId);
  if(songs.length){
    const list=document.getElementById('artistSongsList');
    document.getElementById('songsBlock').style.display='block';
    const singles=songs.filter(s=>!s.albumId);
    const albums={};
    songs.filter(s=>s.albumId).forEach(s=>{(albums[s.albumId]=albums[s.albumId]||[]).push(s);});
    function esc(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
    function coverImg(url,size){return url?`<img src="${IMG(url,size)}" data-o="${url}" onerror="IMGFB(this)" style="width:48px;height:48px;object-fit:cover;border-radius:4px">`:'';}
    function songRow(s,indent){
      const a=document.createElement('a');
      a.href='/songs/'+s.slug+'.html';
      a.style.cssText='display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;padding:8px;border:1px solid #eee;border-radius:6px'+(indent?';margin-left:20px':'');
      a.innerHTML=coverImg(s.cover,160)+`<span style="font-weight:600">${s.title}</span>`;
      return a;
    }
    let albumModal=document.getElementById('albumModal');
    if(!albumModal){
      albumModal=document.createElement('div');
      albumModal.id='albumModal';
      albumModal.style.cssText='display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:500;align-items:flex-end;justify-content:center';
      albumModal.innerHTML='<div id="albumSheet" style="background:#fff;width:100%;max-width:520px;max-height:85vh;overflow-y:auto;border-radius:16px 16px 0 0;padding:20px"></div>';
      document.body.appendChild(albumModal);
      albumModal.addEventListener('click',e=>{if(e.target===albumModal)albumModal.style.display='none';});
    }
    function openAlbum(albumId){
      const tracks=albums[albumId].slice().sort((a,b)=>(a.trackNumber||0)-(b.trackNumber||0));
      const first=tracks[0];
      const cover=first.albumCover||first.cover;
      const sheet=document.getElementById('albumSheet');
      sheet.innerHTML='';
      const head=document.createElement('div');
      head.style.cssText='display:flex;gap:14px;align-items:flex-start';
      head.innerHTML=(cover?`<img src="${IMG(cover,320)}" data-o="${esc(cover)}" onerror="IMGFB(this)" style="width:96px;height:96px;object-fit:cover;border-radius:10px;flex-shrink:0">`:'')+
        `<div style="flex:1;min-width:0"><h3 style="font-size:17px;margin:0">${esc(first.album||'Album')}</h3>`+
        (first.year||first.genre?`<p style="font-size:12px;color:#888;margin-top:4px">${[esc(first.year||''),esc(first.genre||'')].filter(Boolean).join(' · ')}</p>`:'')+
        `<p style="font-size:12px;color:#888;margin-top:4px">${tracks.length} track${tracks.length===1?'':'s'}</p></div>`+
        '<button onclick="document.getElementById(\'albumModal\').style.display=\'none\'" style="border:none;background:none;font-size:22px;line-height:1;cursor:pointer;flex-shrink:0">×</button>';
      sheet.appendChild(head);
      const list2=document.createElement('div');
      list2.style.cssText='margin-top:16px;display:flex;flex-direction:column;gap:8px';
      tracks.forEach(s=>{
        const a=document.createElement('a');
        a.href='/songs/'+s.slug+'.html';
        a.style.cssText='display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;padding:8px;border:1px solid #eee;border-radius:8px';
        a.innerHTML=`<span style="font-size:11px;color:#999;width:18px;flex-shrink:0">${s.trackNumber||''}</span>`+
          coverImg(s.cover,160)+
          `<span style="font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(s.title)}</span>`+
          `<span style="font-size:11px;font-weight:700;color:#e11;flex-shrink:0;white-space:nowrap">⬇ Download</span>`;
        list2.appendChild(a);
      });
      sheet.appendChild(list2);
      albumModal.style.display='flex';
    }
    Object.keys(albums).forEach(albumId=>{
      const tracks=albums[albumId].slice().sort((a,b)=>(a.trackNumber||0)-(b.trackNumber||0));
      const first=tracks[0];
      const header=document.createElement('div');
      header.style.cssText='display:flex;align-items:center;gap:12px;padding:8px;border:1px solid #eee;border-radius:6px;cursor:pointer';
      header.innerHTML=coverImg(first.albumCover||first.cover,160)+
        `<span style="font-weight:600;flex:1">💿 ${esc(first.album||'Album')}</span><span style="font-size:12px;color:#888">${tracks.length} track${tracks.length===1?'':'s'} ›</span>`;
      header.addEventListener('click',()=>openAlbum(albumId));
      list.appendChild(header);
    });
    singles.forEach(s=>list.appendChild(songRow(s,false)));
  }

  const track=document.getElementById('tickerTrack');
  [...(db.posts||[]).slice(0,6),...(db.posts||[]).slice(0,6)].forEach(p=>{const t=document.createElement('span');t.textContent=p.title;track.appendChild(t);});
}
init();
window.addEventListener('scroll',()=>{document.getElementById('siteNav').classList.toggle('scrolled',window.scrollY>10);});
</script>
<script>
/* WZ-TRACK */
(function(){
  var API='https://wavzo-db.dakudinamoses.workers.dev/track';
  var host=location.hostname;
  var live=(host==='wavzo.com.ng'||host==='www.wavzo.com.ng');
  var owner=false;try{owner=!!localStorage.getItem('wz_key');}catch(e){}
  function send(ev,kind,key){
    try{
      if(!live||owner||!key||!/^[\w.\-:~%]{1,120}$/.test(key))return;
      var body=JSON.stringify({ev:ev,kind:kind,key:key,ref:document.referrer||''});
      if(navigator.sendBeacon){navigator.sendBeacon(API,new Blob([body],{type:'text/plain'}));return;}
      fetch(API,{method:'POST',body:body,keepalive:true,headers:{'Content-Type':'text/plain'}});
    }catch(e){}
  }
  window.WZ={track:send};
  function pathSlug(dir){
    var m=location.pathname.match(new RegExp('^/'+dir+'/([^/]+?)(?:\\.html)?$'));
    if(!m)return '';
    try{return decodeURIComponent(m[1]);}catch(e){return m[1];}
  }
  function wrap(name,fn){
    var old=window[name];
    if(typeof old!=='function')return;
    window[name]=function(){try{fn.apply(null,arguments);}catch(e){} return old.apply(this,arguments);};
  }
  var path=location.pathname,kind='',key='';
  if(pathSlug('posts')){kind='post';key=pathSlug('posts');}
  else if(pathSlug('songs')){kind='song';key=pathSlug('songs');}
  else if(pathSlug('artists')){kind='artist';key=pathSlug('artists');}
  else if(path==='/'||path==='/index.html'){kind='page';key='home';}
  else if(path==='/artists.html'){kind='page';key='artists';}
  if(!kind)return;
  send('view',kind,key);

  // first play of any audio/video on the page
  var played={};
  document.addEventListener('play',function(e){
    var t=e.target;if(!t||!t.tagName)return;
    var id=(t.currentSrc||t.src||t.tagName);
    if(played[id])return;played[id]=1;
    send('play',kind,key);
  },true);

  if(kind==='post'){
    wrap('trackDownload',function(){send('download','post',key);});
    wrap('sharePost',function(){send('share','post',key);});
  }
  if(kind==='song'){
    wrap('downloadMp3',function(){send('download','song',key);});
    // a tap inside the YouTube player moves focus into the iframe
    window.addEventListener('blur',function(){
      setTimeout(function(){
        var a=document.activeElement;
        if(a&&a.tagName==='IFRAME'&&!a._wz){a._wz=1;send('yt','song',key);}
      },50);
    });
  }
  // clicks on outbound links (YouTube, streaming, social)
  document.addEventListener('click',function(e){
    var a=e.target&&e.target.closest?e.target.closest('a[href]'):null;
    if(!a)return;
    var h=a.getAttribute('href')||'';
    if(!/^https?:\/\//i.test(h)||h.indexOf(host)>-1)return;
    send(/youtube\.com|youtu\.be/i.test(h)?'yt':'click',kind,key);
  },true);
  if(kind==='artist'){
    document.addEventListener('click',function(e){
      var a=e.target&&e.target.closest?e.target.closest('a[href]'):null;
      if(a&&/\/songs\//.test(a.getAttribute('href')||''))send('click','artist',key);
    },true);
  }
})();
</script>
<script>
/* PROMO-BANNER */
(function(){
  var WA_NUMBER='2348124992371';
  if(!WA_NUMBER||WA_NUMBER.indexOf('REPLACE')===0)return;
  var owner=false;try{owner=!!localStorage.getItem('wz_key');}catch(e){}
  if(owner)return;
  var HIDE_KEY='wz_promo_hidden_until';
  try{
    var until=+(localStorage.getItem(HIDE_KEY)||0);
    if(until&&Date.now()<until)return;
  }catch(e){}

  var css=document.createElement('style');
  css.textContent=
    '#wzPromo{position:fixed;left:50%;bottom:-100px;transform:translateX(-50%);z-index:400;'+
    'background:#0a0a0a;color:#fff;padding:12px 16px;border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,.35);'+
    'display:flex;align-items:center;gap:10px;max-width:92vw;transition:bottom .5s ease;font-family:inherit}'+
    '#wzPromo.show{bottom:16px}'+
    '#wzPromo a{color:#fff;text-decoration:none;font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px}'+
    '#wzPromo .x{cursor:pointer;color:#888;font-size:16px;line-height:1;padding:2px 4px;flex-shrink:0}'+
    '@media(max-width:420px){#wzPromo a{font-size:12px}}';
  document.head.appendChild(css);

  var el=document.createElement('div');
  el.id='wzPromo';
  var text=encodeURIComponent("Hi WAVZO, I'd like to upload my song.");
  el.innerHTML='<a href="https://wa.me/'+WA_NUMBER+'?text='+text+'" target="_blank" rel="noopener">🎵 Upload your song on WAVZO — chat us on WhatsApp</a>'+
    '<span class="x" id="wzPromoClose">×</span>';
  document.body.appendChild(el);

  setTimeout(function(){el.classList.add('show');},2500);
  document.getElementById('wzPromoClose').addEventListener('click',function(e){
    e.preventDefault();e.stopPropagation();
    el.classList.remove('show');
    try{localStorage.setItem(HIDE_KEY,String(Date.now()+24*3600000));}catch(err){}
    setTimeout(function(){el.remove();},600);
  });
})();
</script>
