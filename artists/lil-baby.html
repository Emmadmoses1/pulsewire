<script>
const BIN_ID='6aa50e3aac6210605ac3c542';
const BIN_KEY='public';
const BIN_URL='https://wavzo-db.dakudinamoses.workers.dev/v3/b/'+BIN_ID;
const artistId='art-1789886555804';
const PREART={"artist": {"id": "art-1789886555804", "name": "Lil Baby", "genre": "Hip-Hop", "bio": "Dominique Armani Jones, known professionally as Lil Baby, is an American rapper, singer, and songwriter. He rose to prominence following the release of his 2017 mixtapes Harder than Hard and Too Hard — the former of which spawned his first Billboard Hot 100 entry with its lead single, \"My Dawg.\" He signed with Quality Control Music, an imprint of Motown and Capitol Records to release his debut studio album Harder Than Ever (2018), which peaked at number three on the Billboard 200 and was supported by the Billboard Hot 100-top ten single \"Yes Indeed\". Later that year, he released the collaborative mixtape Drip Harder with fellow Georgia-based rapper Gunna, and his solo mixtape Street Gossip; the former spawned his second top-ten single \"Drip Too Hard\", while the latter peaked at number two on the Billboard 200.", "slug": "lil-baby", "photo": "https://upload.wikimedia.org/wikipedia/commons/4/46/Lil_Baby_2023.png?utm_source=en.wikipedia.org&utm_campaign=api&utm_content=thumbnail_unscaled"}, "songs": [], "titles": ["Holy Ghost | Emma D Moses", "Reform receives record £36m donation from crypto billionaire", "Burnham and Badenoch revive red versus blue politics as Reform land 'gobsmacking' donation", "Lightning Houthi advance in Yemen may bring dangerous new dimension to Iran war", "Masked men, lorries and road blocks: How anti-migrant activists are changing tactics", "Trump says united Ireland would be 'fantastic' during visit to Dublin"]};

async function init(){
  /* FAST-ARTIST */
  let db;
  if(typeof PREART!=='undefined'&&PREART&&PREART.artist){
    db={artists:[PREART.artist],songs:PREART.songs||[],posts:(PREART.titles||[]).map(t=>({title:t}))};
  }else{
    const res=await fetch(BIN_URL+'/latest',{headers:{'X-Master-Key':BIN_KEY}});
    const data=await res.json();
    db=data.record||{};
  }
  const artist=(db.artists||[]).find(a=>a.id===artistId);
  if(!artist)return;

  document.getElementById('crumbArtist').textContent=artist.name;
  document.getElementById('artistName').textContent=artist.name;
  document.getElementById('artistGenre').textContent=artist.genre||'';
  document.getElementById('artistBio').textContent=artist.bio||'';
  if(artist.photo){
    const img=document.getElementById('artistPhoto');
    img.src=artist.photo;
    img.style.display='block';
  }

  const songs=(db.songs||[]).filter(s=>s.artistId===artistId);
  if(songs.length){
    const list=document.getElementById('artistSongsList');
    document.getElementById('songsBlock').style.display='block';
    songs.forEach(s=>{
      const a=document.createElement('a');
      a.href='/songs/'+s.slug+'.html';
      a.style.cssText='display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;padding:8px;border:1px solid #eee;border-radius:6px';
      a.innerHTML=(s.cover?`<img src="${s.cover}" style="width:48px;height:48px;object-fit:cover;border-radius:4px">`:'')+
        `<span style="font-weight:600">${s.title}</span>`;
      list.appendChild(a);
    });
  }

  const track=document.getElementById('tickerTrack');
  [...(db.posts||[]).slice(0,6),...(db.posts||[]).slice(0,6)].forEach(p=>{const t=document.createElement('span');t.textContent=p.title;track.appendChild(t);});
}
init();
window.addEventListener('scroll',()=>{document.getElementById('siteNav').classList.toggle('scrolled',window.scrollY>10);});
</script>
